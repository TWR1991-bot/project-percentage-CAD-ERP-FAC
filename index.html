<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專案進度掌控</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* ===== 科技感/工業風 主題（舒適深藍版） ===== */
        :root {
            --c-bg:        #1a2035;   /* 深海軍藍（不再全黑） */
            --c-surface:   #232f47;   /* 卡片底色 */
            --c-surface2:  #2c3a54;   /* 次層面 / input */
            --c-border:    #3d4f6a;   /* 邊框 */
            --c-border2:   #2c3a54;   /* 淺邊框 */

            /* 編輯 / 檢視頁專用（更亮一層） */
            --c-edit-bg:      #243351;
            --c-edit-surface: #2e4068;
            --c-edit-surface2:#364a75;
            --c-edit-border:  #4a6090;

            --c-accent:    #2b82c9;   /* 主要藍（稍亮） */
            --c-accent-h:  #3a9de0;   /* hover 藍 */
            --c-accent2:   #1a3d6b;   /* 深藍底 */
            --c-cyan:      #4dd9e0;   /* 科技青（柔化） */
            --c-text:      #dde3ec;   /* 主文字（更亮） */
            --c-text2:     #9aaabe;   /* 次文字（藍灰調） */
            --c-text3:     #5e7494;   /* 暗文字 */
            --c-success:   #2ea043;
            --c-warn:      #d29922;
            --c-danger:    #e05252;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--c-bg); }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }

        /* 背景：深藍格網紋（工業感，柔化版） */
        .bg-healing {
            background-color: var(--c-bg);
            background-image:
                linear-gradient(rgba(61,79,106,0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(61,79,106,0.5) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* 導覽列 */
        nav {
            background: var(--c-surface) !important;
            border-right: 1px solid var(--c-border) !important;
            border-radius: 0 !important;
            box-shadow: 4px 0 24px rgba(0,0,0,0.4) !important;
        }
        nav .border-b { border-color: var(--c-border) !important; }
        nav h1 { color: var(--c-text) !important; }

        /* Logo 圖標 */
        nav .bg-gradient-to-br {
            background: linear-gradient(135deg, var(--c-accent), var(--c-cyan)) !important;
            box-shadow: 0 0 12px rgba(57,208,216,0.3) !important;
        }

        /* 導覽按鈕 */
        #btn-dashboard, #btn-closed, #btn-settings, #btn-parts, #btn-partsdb {
            color: var(--c-text2);
            border-radius: 6px !important;
            transition: all 0.2s;
        }
        #btn-dashboard:hover, #btn-closed:hover, #btn-settings:hover, #btn-parts:hover, #btn-partsdb:hover {
            background: var(--c-surface2) !important;
            color: var(--c-text) !important;
        }
        #btn-dashboard.bg-indigo-50,
        #btn-dashboard.text-indigo-600 {
            background: var(--c-accent2) !important;
            color: var(--c-cyan) !important;
            border-left: 2px solid var(--c-cyan);
            font-weight: 700 !important;
        }
        /* 強制覆蓋 active tab 文字色 */
        #btn-dashboard.text-indigo-600 span,
        #btn-dashboard.text-indigo-600 i { color: var(--c-cyan) !important; }

        /* 主區域背景 */
        main { background: transparent; }

        /* Header */
        header.h-20 {
            background: transparent !important;
            border-bottom: 1px solid var(--c-border) !important;
        }
        #page-title { color: var(--c-text) !important; }

        /* 卡片 */
        .bg-white {
            background: var(--c-surface) !important;
            border-color: var(--c-border) !important;
        }
        .bg-slate-50 { background: var(--c-surface2) !important; }

        /* A/B/C/D 案區塊底色區分（讓四個區塊一眼就能分辨，不再長得一樣） */
        .bg-white.area-panel-a { background: #26304d !important; }
        .bg-white.area-panel-b { background: #1f3a38 !important; }
        .bg-white.area-panel-c { background: #3a3120 !important; }
        .bg-white.area-panel-d { background: #3a232f !important; }

        .bg-slate-50.area-header-a { background: #2d3559 !important; }
        .bg-slate-50.area-header-b { background: #244543 !important; }
        .bg-slate-50.area-header-c { background: #493c24 !important; }
        .bg-slate-50.area-header-d { background: #452a37 !important; }

        /* 文字色覆蓋 */
        .text-slate-800, .text-slate-700 { color: var(--c-text) !important; }
        .text-slate-600 { color: var(--c-text) !important; }
        .text-slate-500, .text-slate-400 { color: var(--c-text2) !important; }
        .text-slate-300 { color: var(--c-text3) !important; }

        /* 邊框 */
        .border-slate-100, .border-slate-200 { border-color: var(--c-border) !important; }

        /* 進度條軌道 */
        .bg-slate-100 { background: var(--c-surface2) !important; }

        /* ===== 按鈕重製 ===== */

        /* 主要儲存按鈕 */
        #btn-save-detail,
        button.bg-indigo-600 {
            background: var(--c-accent) !important;
            box-shadow: 0 0 0 0 rgba(29,111,164,0);
            border: 1px solid var(--c-accent-h);
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
            border-radius: 6px !important;
        }
        #btn-save-detail:hover,
        button.bg-indigo-600:hover {
            background: var(--c-accent-h) !important;
            box-shadow: 0 0 14px rgba(37,137,199,0.5);
            transform: translateY(-1px);
        }

        /* 次要按鈕（檢視/淺色） */
        button.bg-slate-50,
        button.bg-white {
            background: var(--c-surface2) !important;
            border: 1px solid var(--c-border) !important;
            color: var(--c-text2) !important;
            border-radius: 6px !important;
            transition: all 0.2s;
        }
        button.bg-slate-50:hover,
        button.bg-white:hover {
            background: var(--c-border) !important;
            color: var(--c-text) !important;
        }

        /* 編輯按鈕 (bg-indigo-50) */
        button.bg-indigo-50 {
            background: var(--c-accent2) !important;
            border: 1px solid var(--c-accent) !important;
            color: var(--c-cyan) !important;
            border-radius: 6px !important;
        }
        button.bg-indigo-50:hover { background: rgba(29,111,164,0.3) !important; }

        /* 危險按鈕 */
        button.bg-rose-50 {
            background: rgba(185,28,28,0.12) !important;
            border: 1px solid #b91c1c !important;
            color: #f87171 !important;
            border-radius: 6px !important;
        }
        button.bg-rose-50:hover { background: rgba(185,28,28,0.25) !important; }

        /* 深色翻閱按鈕 */
        button.bg-slate-700 {
            background: var(--c-accent) !important;
            border: 1px solid var(--c-accent-h);
            border-radius: 6px !important;
        }
        button.bg-slate-700:hover { background: var(--c-accent-h) !important; }

        /* 年度篩選按鈕 */
        button.bg-indigo-600 {
            background: var(--c-accent) !important;
            box-shadow: 0 0 10px rgba(29,111,164,0.4);
        }

        /* Phase tab 按鈕 */
        #tab-drawing, #tab-production, #tab-shipping {
            border-radius: 6px !important;
            transition: all 0.2s;
        }
        #tab-drawing.bg-blue-100, #tab-drawing.text-blue-700 {
            background: rgba(29,111,164,0.2) !important;
            color: var(--c-cyan) !important;
            border: 1px solid var(--c-accent) !important;
        }

        /* 進度圓圈顏色 */
        .text-indigo-500 { color: var(--c-cyan) !important; }

        /* 進度條顏色 */
        .from-blue-400.to-blue-500     { background: linear-gradient(90deg, #1d6fa4, #39d0d8) !important; }
        .from-orange-400.to-orange-500 { background: linear-gradient(90deg, #e07b39, #f5a623) !important; }
        .from-emerald-400.to-emerald-500 { background: linear-gradient(90deg, #238636, #2ea043) !important; }

        /* 詳情頁 header */
        #view-project-detail > header {
            background: #f8fafc !important;
            border-bottom: 1px solid #e2e8f0 !important;
            color: #1e293b !important;
        }
        /* 詳情頁整體：淺色底深色字 */
        #view-project-detail {
            background: #f1f5f9 !important;
            color: #1e293b !important;
        }
        /* 詳情頁卡片 */
        #view-project-detail .bg-white {
            background: #ffffff !important;
            border-color: #e2e8f0 !important;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06) !important;
        }
        #view-project-detail .bg-slate-50 {
            background: #f8fafc !important;
            border-color: #e9eef5 !important;
        }
        /* 詳情頁文字色全部拉回深色 */
        #view-project-detail,
        #view-project-detail * {
            color: inherit;
        }
        #view-project-detail .text-slate-800,
        #view-project-detail .text-slate-700 { color: #1e293b !important; }
        #view-project-detail .text-slate-600  { color: #334155 !important; }
        #view-project-detail .text-slate-500,
        #view-project-detail .text-slate-400  { color: #64748b !important; }
        #view-project-detail .text-slate-300  { color: #94a3b8 !important; }
        #view-project-detail .text-indigo-700 { color: #3730a3 !important; }
        #view-project-detail .text-indigo-600,
        #view-project-detail .text-indigo-500 { color: #4f46e5 !important; }
        #view-project-detail .text-blue-600   { color: #2563eb !important; }
        #view-project-detail .text-orange-600 { color: #ea580c !important; }
        #view-project-detail .text-emerald-600 { color: #059669 !important; }
        /* 邊框 */
        #view-project-detail .border-slate-100,
        #view-project-detail .border-slate-200 { border-color: #e2e8f0 !important; }
        /* progress box */
        #view-project-detail .bg-blue-50\/50    { background: rgba(59,130,246,0.08) !important; border-color: rgba(59,130,246,0.2) !important; }
        #view-project-detail .bg-orange-50\/50  { background: rgba(249,115,22,0.08) !important; border-color: rgba(249,115,22,0.2) !important; }
        #view-project-detail .bg-emerald-50\/50 { background: rgba(16,185,129,0.08) !important; border-color: rgba(16,185,129,0.2) !important; }
        /* 進度條底色 */
        #view-project-detail .bg-slate-100 { background: #e9eef5 !important; }
        /* input 欄位 */
        #view-project-detail input[type="text"],
        #view-project-detail input[type="number"],
        #view-project-detail select,
        #view-project-detail textarea {
            background: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #1e293b !important;
        }
        #view-project-detail input:focus,
        #view-project-detail select:focus,
        #view-project-detail textarea:focus {
            background: #ffffff !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15) !important;
        }
        /* 返回按鈕 */
        #view-project-detail button[onclick="backToMain()"] {
            background: transparent !important;
            border: 1px solid #cbd5e1 !important;
            color: #475569 !important;
        }
        #view-project-detail button[onclick="backToMain()"]:hover {
            background: #e2e8f0 !important;
            color: #1e293b !important;
        }
        /* 儲存按鈕在淺色頁 */
        #view-project-detail #btn-save-detail {
            background: #2563eb !important;
            border-color: #1d4ed8 !important;
            color: #ffffff !important;
        }
        #view-project-detail #btn-save-detail:hover {
            background: #1d4ed8 !important;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3) !important;
        }
        /* badge / tag */
        #view-project-detail .bg-indigo-50  { background: #eef2ff !important; }
        #view-project-detail .bg-indigo-100 { background: #e0e7ff !important; }
        /* sticky header in detail table */
        #view-project-detail .sticky-header th {
            background: #f1f5f9 !important;
            color: #475569 !important;
            box-shadow: inset 0 -2px 0 #e2e8f0 !important;
        }

        /* 進行中專案詳情表 — 細項圖面加寬、大類直式、進度欄 */
        #data-table th.col-detail,
        #data-table td.col-detail {
            min-width: 280px;
            width: 320px;
            max-width: 420px;
        }
        #data-table th.col-major,
        #data-table td.col-major {
            min-width: 3.5rem;
            width: 4rem;
            max-width: 4.5rem;
            padding-left: 4px !important;
            padding-right: 4px !important;
            text-align: center;
            vertical-align: middle;
        }
        #data-table th.col-major {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
        #data-table .major-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            letter-spacing: 0.08em;
            font-weight: 900;
            margin: 0 auto;
            display: inline-block;
            line-height: 1.3;
            color: #334155;
        }
        #data-table td.col-major .major-actions {
            writing-mode: horizontal-tb;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
        }
        #data-table th.col-progress,
        #data-table td.col-progress {
            min-width: 72px;
            width: 80px;
            max-width: 88px;
            padding-left: 4px !important;
            padding-right: 4px !important;
        }
        #data-table th.col-progress {
            white-space: normal;
            word-break: break-all;
            line-height: 1.35;
            vertical-align: middle;
        }
        #data-table td.col-progress input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
        }
        #data-table th.col-progress-input,
        #data-table td.col-progress-input {
            min-width: 80px;
            width: 88px;
            max-width: 96px;
            padding-left: 4px !important;
            padding-right: 4px !important;
        }
        #data-table th.col-progress-input {
            white-space: normal;
            line-height: 1.35;
            vertical-align: middle;
        }
        #data-table td.col-progress-input input {
            width: 3.25rem;
            padding-left: 0.35rem;
            padding-right: 0.35rem;
            font-size: 0.875rem;
        }

        /* 詳情頁 progress box */
        .bg-blue-50\/50   { background: rgba(29,111,164,0.08) !important; border-color: rgba(29,111,164,0.2) !important; }
        .bg-orange-50\/50 { background: rgba(224,123,57,0.08) !important; border-color: rgba(224,123,57,0.2) !important; }
        .bg-emerald-50\/50 { background: rgba(35,134,54,0.08) !important; border-color: rgba(35,134,54,0.2) !important; }

        /* 大數字色 */
        .text-blue-600   { color: var(--c-cyan) !important; }
        .text-orange-600 { color: #f5a623 !important; }
        .text-emerald-600 { color: #2ea043 !important; }

        /* 設定頁 gradient card */
        .bg-gradient-to-br.from-indigo-500.to-purple-600 {
            background: linear-gradient(135deg, #0a3d6b 0%, #1d6fa4 100%) !important;
            border: 1px solid var(--c-accent) !important;
            box-shadow: 0 0 24px rgba(29,111,164,0.25) !important;
        }

        /* Modal — 模板工廠完整淺色主題（修正暗底暗字） */
        #template-modal-content,
        #append-template-content {
            color: #1e293b !important;
        }
        #template-modal-content .bg-white,
        #append-template-content .bg-white {
            background: #ffffff !important;
            border-color: #e2e8f0 !important;
            color: #1e293b !important;
        }
        #template-modal-content .bg-slate-50,
        #template-modal-content .bg-slate-50\/50,
        #append-template-content .bg-slate-50,
        #append-template-content .bg-slate-50\/50 {
            background: #f8fafc !important;
        }
        #template-modal-content .bg-slate-100,
        #append-template-content .bg-slate-100 {
            background: #f1f5f9 !important;
        }
        #template-modal-content .text-slate-800,
        #template-modal-content .text-slate-700,
        #template-modal-content .text-slate-600,
        #append-template-content .text-slate-800,
        #append-template-content .text-slate-700,
        #append-template-content .text-slate-600 {
            color: #334155 !important;
        }
        #template-modal-content .text-slate-500,
        #template-modal-content .text-slate-400,
        #append-template-content .text-slate-500,
        #append-template-content .text-slate-400 {
            color: #64748b !important;
        }
        #template-modal-content .text-slate-300,
        #append-template-content .text-slate-300 {
            color: #94a3b8 !important;
        }
        #template-modal-content label,
        #append-template-content label {
            color: #64748b !important;
        }
        #template-modal-content .text-indigo-700,
        #append-template-content .text-indigo-700 {
            color: #4338ca !important;
        }
        #template-modal-content .text-indigo-600,
        #append-template-content .text-indigo-600 {
            color: #4f46e5 !important;
        }
        #template-modal-content .text-indigo-500,
        #template-modal-content .text-indigo-400,
        #append-template-content .text-indigo-500,
        #append-template-content .text-indigo-400 {
            color: #6366f1 !important;
        }
        #template-modal-content .text-indigo-300,
        #append-template-content .text-indigo-300 {
            color: #a5b4fc !important;
        }
        #template-modal-content .text-indigo-300:hover,
        #append-template-content .text-indigo-300:hover {
            color: #4f46e5 !important;
        }
        #template-modal-content .bg-indigo-50,
        #append-template-content .bg-indigo-50 {
            background: #eef2ff !important;
        }
        #template-modal-content .bg-indigo-100,
        #append-template-content .bg-indigo-100,
        #template-modal-content .hover\:bg-indigo-100:hover,
        #append-template-content .hover\:bg-indigo-100:hover {
            background: #e0e7ff !important;
        }
        #template-modal-content .bg-blue-50,
        #append-template-content .bg-blue-50 {
            background: #eff6ff !important;
        }
        #template-modal-content .text-blue-600,
        #append-template-content .text-blue-600 {
            color: #2563eb !important;
        }
        #template-modal-content .border-slate-100,
        #template-modal-content .border-slate-200,
        #append-template-content .border-slate-100,
        #append-template-content .border-slate-200 {
            border-color: #e2e8f0 !important;
        }
        #template-modal-content .bg-slate-200,
        #append-template-content .bg-slate-200 {
            background-color: #e2e8f0 !important;
        }
        #template-modal-content .tree-line::before,
        #append-template-content .tree-line::before {
            background-color: #cbd5e1 !important;
        }
        #template-modal-content input,
        #template-modal-content select,
        #append-template-content input,
        #append-template-content select {
            background: #ffffff !important;
            border-color: #cbd5e1 !important;
            color: #1e293b !important;
        }
        #template-modal-content input:focus,
        #template-modal-content select:focus,
        #append-template-content input:focus,
        #append-template-content select:focus {
            background: #ffffff !important;
            border-color: #818cf8 !important;
            box-shadow: 0 0 0 2px rgba(99,102,241,0.2) !important;
        }
        #template-modal-content button.bg-white,
        #append-template-content button.bg-white {
            background: #ffffff !important;
            color: #475569 !important;
        }
        #template-modal-content button.bg-white:hover,
        #append-template-content button.bg-white:hover,
        #template-modal-content .hover\:bg-slate-100:hover,
        #append-template-content .hover\:bg-slate-100:hover {
            background: #f1f5f9 !important;
        }
        #template-modal-content .hover\:bg-rose-50:hover,
        #append-template-content .hover\:bg-rose-50:hover {
            background: #fff1f2 !important;
        }
        #template-modal-content .hover\:text-rose-500:hover,
        #append-template-content .hover\:text-rose-500:hover {
            color: #f43f5e !important;
        }
        #template-modal-content .hover\:text-indigo-500:hover,
        #append-template-content .hover\:text-indigo-500:hover,
        #template-modal-content .hover\:text-indigo-600:hover,
        #append-template-content .hover\:text-indigo-600:hover {
            color: #4f46e5 !important;
        }
        .bg-gradient-to-r.from-indigo-500.to-purple-600 {
            background: linear-gradient(90deg, #4f46e5, #7c3aed) !important;
            border-bottom: none;
        }

        /* 全域載入動畫 */
        #global-loader { background: rgba(13,17,23,0.97) !important; }
        #global-loader h2 { color: var(--c-cyan) !important; }
        .border-indigo-200 { border-color: var(--c-border) !important; }
        .border-t-indigo-600 { border-top-color: var(--c-cyan) !important; }

        /* table 區域 */
        #table-container { background: var(--c-bg) !important; }

        /* sticky header */
        .sticky-header th {
            position: sticky;
            top: 0;
            z-index: 40 !important;
            background: var(--c-surface2) !important;
            box-shadow: inset 0 -2px 0 var(--c-border);
            background-clip: padding-box;
            color: var(--c-text2);
        }

        /* input 表單 */
        input[type="text"], input[type="number"], select, textarea {
            background: var(--c-bg) !important;
            border-color: var(--c-border) !important;
            color: var(--c-text) !important;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--c-accent) !important;
            box-shadow: 0 0 0 2px rgba(29,111,164,0.25) !important;
            background: var(--c-surface2) !important;
        }
        input[type="checkbox"] {
            accent-color: var(--c-cyan);
        }

        /* hover-lift */
        .hover-lift {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 0 1px var(--c-accent);
        }

        /* 圓形進度動畫 */
        .circle-progress {
            transition: stroke-dasharray 1s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0px 0px 4px rgba(57,208,216,0.4));
        }

        /* 模板樹狀線條 */
        .tree-line { position: relative; }
        .tree-line::before {
            content: '';
            position: absolute;
            left: 0.75rem;
            top: 2rem;
            bottom: 0;
            width: 2px;
            background-color: var(--c-border);
        }

        /* 導覽列 active 狀態用 JS 動態加的 class，需要強制覆蓋 */
        .bg-indigo-50 { background: var(--c-accent2) !important; }
        .text-indigo-600 { color: var(--c-cyan) !important; }
        .text-indigo-500 { color: var(--c-cyan) !important; }
        .text-indigo-700 { color: #a5d8ff !important; }
        .bg-indigo-100 { background: var(--c-accent2) !important; }
        .shadow-indigo-200 { box-shadow: none !important; }

        /* 專案 ID badge */
        .bg-indigo-50.text-indigo-500 { color: var(--c-cyan) !important; }

        /* Area theme color dots — keep colorful */
        .bg-indigo-400 { background: #1d6fa4 !important; }
        .bg-emerald-400 { background: #2ea043 !important; }
        .bg-amber-400  { background: #d29922 !important; }
        .bg-rose-400   { background: #c62828 !important; }

        /* exporting pdf */
        .exporting-pdf {
            height: auto !important;
            overflow: visible !important;
            position: relative !important;
        }
        .exporting-pdf #detail-body-wrapper {
            overflow: visible !important;
            height: auto !important;
        }
        .exporting-pdf #table-container {
            overflow: visible !important;
            max-height: none !important;
            height: auto !important;
        }
        /* 匯出時連外層 body/main 也一併解除高度鎖定與裁切,
           避免超過一個畫面高度的內容在轉圖時被截斷 */
        body.pdf-exporting-active {
            height: auto !important;
            overflow: visible !important;
        }
        body.pdf-exporting-active main {
            overflow: visible !important;
            height: auto !important;
        }
        body.pdf-exporting-active nav {
            display: none !important;
        }

        /* 科技感掃描線裝飾（僅主背景，subtle） */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(57,208,216,0.012) 2px,
                rgba(57,208,216,0.012) 4px
            );
            pointer-events: none;
            z-index: 0;
        }
    </style>

    <script>
        // 定義檢核項目清單常數
        const CHECKLIST_TEMPLATES = {
            drawing: ['製作圖進度', 'ERP製程規劃', '本體BOM', '本體計畫生產', '組裝BOM', '組裝計畫生產'],
            production: ['製作開始', '製作完成', '組裝完成', '噴漆完成'],
            shipping: ['主體', '周邊(含欄杆)', '市購品']
        };

        const AREAS = ['A案', 'B案', 'C案', 'D案'];
        
        // 四大區域專屬主題配色定義
        const AREA_THEMES = {
            'A案': { key: 'a', dot: 'bg-indigo-400', badgeBg: 'bg-indigo-100', badgeText: 'text-indigo-700', tagBg: 'bg-indigo-50', tagText: 'text-indigo-500' },
            'B案': { key: 'b', dot: 'bg-emerald-400', badgeBg: 'bg-emerald-100', badgeText: 'text-emerald-700', tagBg: 'bg-emerald-50', tagText: 'text-emerald-500' },
            'C案': { key: 'c', dot: 'bg-amber-400', badgeBg: 'bg-amber-100', badgeText: 'text-amber-700', tagBg: 'bg-amber-50', tagText: 'text-amber-600' },
            'D案': { key: 'd', dot: 'bg-rose-400', badgeBg: 'bg-rose-100', badgeText: 'text-rose-700', tagBg: 'bg-rose-50', tagText: 'text-rose-500' }
        };

        // Google Apps Script API 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbyksZrGnmM62ilv7lOAho8UtHlG__Ggkzqf06p7rZ67NvyYlFu-mpmCbs8_GNJuMht22A/exec";

        // 系統資料
        let state = {
            currentTab: 'dashboard',
            editingProjectId: null,
            isEditMode: false,
            hasUnsavedChanges: false, 
            activePhaseTab: 'drawing', 
            tempEditData: null,
            selectedYear: null,
            templateMajors: [],
            projects: [],
            closedProjects: []
        };

        // --- 核心運算邏輯 (依照最新規則修改) ---
        function calculateProgress(projectData) {
            let drawWeighted = 0, prodWeighted = 0, shipWeighted = 0;
            let drawW = 0, prodW = 0, shipW = 0;
            let weightSum = 0;

            projectData.majors.forEach(major => {
                major.mediums.forEach(medium => {
                    let weight = parseFloat(medium.weight) || 0;
                    weightSum += weight;

                    let hasProd = medium.hasProduction !== false;
                    let hasShip = medium.hasShipping !== false;

                    // ★ 修正：無論設備是否為空，weight 都要納入分母
                    //   空設備 = 進度 0%，但佔比仍要計算
                    drawW += weight;
                    if (hasProd) prodW += weight;
                    if (hasShip) shipW += weight;

                    let equipCount = medium.equipments.length;

                    if (equipCount > 0) {
                        let equipDraw = 0, equipProd = 0, equipShip = 0;

                        medium.equipments.forEach(eq => {
                            let detDraw = 0, detProd = 0, detShip = 0;
                            let detCount = eq.details.length;

                            if (detCount > 0) {
                                eq.details.forEach(det => {
                                    // 繪圖進度：僅看 [0] 製作圖進度
                                    detDraw += det.drawing[0] ? 100 : 0;
                                    
                                    // 生產製造：僅看 [1]製作完成, [2]組裝完成, [3]噴漆完成（免組裝則不計組裝完成）
                                    let pChecks = det.production.checks;
                                    let prodDivisor = det.skipAssembly ? 2 : 3;
                                    let prodCheckedCount = (pChecks[1]?1:0) + (pChecks[3]?1:0);
                                    if (!det.skipAssembly) prodCheckedCount += (pChecks[2]?1:0);
                                    detProd += (prodCheckedCount / prodDivisor) * 100;
                                    
                                    // 出貨現場：主體, 周邊, 市購品 三者皆算
                                    detShip += (det.shipping.filter(Boolean).length / 3) * 100;
                                });
                                equipDraw += (detDraw / detCount);
                                equipProd += (detProd / detCount);
                                equipShip += (detShip / detCount);
                            }
                        });
                        
                        drawWeighted += (equipDraw / equipCount) * weight;
                        if (hasProd) prodWeighted += (equipProd / equipCount) * weight;
                        if (hasShip) shipWeighted += (equipShip / equipCount) * weight;
                    }
                    // 空設備：進度貢獻為 0，分母已加，numerator 不加 → 正確壓低整體進度
                });
            });

            // 計算各大階段進度 (若該階段完全沒有被啟用，則為 0)
            let drawTotal = drawW > 0 ? (drawWeighted / drawW) : 0;
            let prodTotal = prodW > 0 ? (prodWeighted / prodW) : 0;
            let shipTotal = shipW > 0 ? (shipWeighted / shipW) : 0;

            // 計算總體達成率 (動態排除未啟用的階段)
            let activePhases = 1; // 繪圖永遠必備
            let totalSum = drawTotal;
            if (prodW > 0) { activePhases++; totalSum += prodTotal; }
            if (shipW > 0) { activePhases++; totalSum += shipTotal; }
            let total = totalSum / activePhases;
            
            return { 
                draw: Math.round(drawTotal), 
                prod: Math.round(prodTotal), 
                ship: Math.round(shipTotal), 
                total: Math.round(total), 
                weightSum: weightSum 
            };
        }

        // --- 主畫面導覽邏輯 ---
        function switchTab(tabId) {
            // 離開五金市購品／歷史典藏的市購品工案時，若還有未儲存的修改先確認
            if (window.SG && !SG.canLeave()) return;
            state.currentTab = tabId;
            document.getElementById('view-main').classList.remove('hidden');
            document.getElementById('view-project-detail').classList.add('hidden');

            ['dashboard', 'parts', 'closed', 'settings', 'partsdb'].forEach(id => {
                const btn = document.getElementById(`btn-${id}`);
                if (id === tabId) {
                    btn.classList.add('bg-indigo-50', 'text-indigo-600', 'font-bold');
                    btn.classList.remove('hover:bg-slate-50', 'text-slate-500', 'font-medium');
                } else {
                    btn.classList.remove('bg-indigo-50', 'text-indigo-600', 'font-bold');
                    btn.classList.add('hover:bg-slate-50', 'text-slate-500', 'font-medium');
                }
            });

            const title = document.getElementById('page-title');
            
            if (tabId === 'dashboard') {
                title.innerText = '專案進度掌控';
                renderDashboard();
            } else if (tabId === 'closed') {
                title.innerText = '歷史典藏館';
                switchClosedSub(state.closedSub || 'drawing');
            } else if (tabId === 'parts') {
                title.innerText = '五金市購品';
                SG.mount(document.getElementById('main-content'), 'parts');
            } else if (tabId === 'partsdb') {
                title.innerText = '市購品資料庫';
                SG.mount(document.getElementById('main-content'), 'db');
            } else {
                title.innerText = '模板與設定中心';
                renderSettings();
            }
        }

        // --- 戰情室 ---
        // ===== 完工期限工具（每次呼叫都以「當天日期」為基準）=====
        const DEADLINE_WARN_DAYS = 90;
        function parseLocalDate(str) {
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
            return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
        }
        function getDaysLeft(deadline) {
            const d = parseLocalDate(deadline);
            if (!d) return null;
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            return Math.round((d - today) / 86400000);
        }
        // 回傳徽章 HTML；isClosed=true 時只顯示日期，不做紅色警示
        function renderDeadlineBadge(deadline, isClosed = false) {
            if (!deadline) {
                return `<span class="text-sm font-bold text-slate-300"><i class="fa-regular fa-calendar mr-1"></i> 完工期限：未設定</span>`;
            }
            const days = getDaysLeft(deadline);
            if (isClosed || days === null) {
                return `<span class="text-sm font-bold text-slate-400"><i class="fa-regular fa-calendar mr-1"></i> 完工期限：${deadline}</span>`;
            }
            const urgent = days <= DEADLINE_WARN_DAYS;
            const note = days < 0 ? `已逾期 ${-days} 天` : (days === 0 ? '今天到期' : `剩 ${days} 天`);
            const cls = urgent
                ? 'text-rose-600 bg-rose-50 border border-rose-200'
                : 'text-slate-500 bg-slate-50 border border-slate-100';
            return `<span class="inline-flex items-center gap-1 text-sm font-bold px-2 py-0.5 rounded-lg ${cls}"><i class="fa-regular fa-calendar${urgent ? '-xmark' : ''}"></i> 完工期限：${deadline}（${note}）</span>`;
        }
        function renderDetailDeadline() {
            const el = document.getElementById('detail-project-deadline');
            if (!el || !state.tempEditData) return;
            const dl = state.tempEditData.deadline || '';
            if (state.isEditMode) {
                el.innerHTML = `
                    <label class="text-xs font-bold text-slate-400 mr-1">完工期限</label>
                    <input type="date" value="${dl}" onchange="updateProjectDeadline(this.value)" class="border border-slate-200 rounded-lg px-2 py-1 text-sm font-bold text-slate-700 bg-white focus:outline-none focus:border-indigo-400">
                    <span id="detail-deadline-badge" class="ml-2">${dl ? renderDeadlineBadge(dl) : ''}</span>`;
            } else {
                el.innerHTML = renderDeadlineBadge(dl, state.tempEditData.status === 'closed');
            }
        }
        function updateProjectDeadline(val) {
            state.tempEditData.deadline = val || '';
            const b = document.getElementById('detail-deadline-badge');
            if (b) b.innerHTML = val ? renderDeadlineBadge(val) : '';
            markUnsaved();
        }

        function renderDashboard() {
            let html = '<div class="flex flex-col gap-8">';
            AREAS.forEach(area => {
                const areaProjects = state.projects.filter(p => p.area === area && p.status === 'active');
                if (areaProjects.length === 0) return;   // 沒有案子的區塊暫時隱藏
                let theme = AREA_THEMES[area] || AREA_THEMES['A案']; // 動態提取該廠區顏色
                
                html += `
                <div class="bg-white area-panel-${theme.key} rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 overflow-hidden flex flex-col">
                    <div class="bg-slate-50 area-header-${theme.key} px-8 py-5 flex justify-between items-center border-b border-slate-100">
                        <span class="font-bold text-lg text-slate-700 flex items-center gap-2"><div class="w-2 h-6 ${theme.dot} rounded-full"></div> ${area}</span>
                        <span class="${theme.badgeBg} ${theme.badgeText} text-sm font-bold px-3 py-1 rounded-full">${areaProjects.length} 個專案</span>
                    </div>
                    <div class="p-6 bg-transparent grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6">
                `;

                if (areaProjects.length === 0) {
                    html += `<div class="col-span-full text-center text-slate-300 py-10"><i class="fa-solid fa-ghost text-4xl mb-3 block"></i>目前靜悄悄的</div>`;
                } else {
                    areaProjects.forEach(project => {
                        const prog = calculateProgress(project);
                        html += `
                        <div class="bg-white border border-slate-100 p-5 rounded-2xl shadow-sm hover-lift relative overflow-hidden group flex flex-col h-full">
                            <div class="flex justify-between items-start mb-4">
                                <div class="min-w-0 pr-2">
                                    <span class="text-sm font-bold ${theme.tagText} ${theme.tagBg} px-2 py-1 rounded-md">${project.id}</span>
                                    <h4 class="font-black text-lg text-slate-800 mt-2 tracking-tight truncate" title="${project.name}">${project.name}</h4>
                                    <div class="mt-1.5">${renderDeadlineBadge(project.deadline)}</div>
                                </div>
                                <div class="relative w-14 h-14 flex items-center justify-center shrink-0">
                                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                        <path class="text-slate-100" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                        <path class="text-indigo-500 circle-progress drop-shadow-sm" stroke-dasharray="${prog.total}, 100" stroke-width="4" stroke="currentColor" fill="none" stroke-linecap="round" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    </svg>
                                    <div class="absolute text-sm font-black text-slate-700">${prog.total}%</div>
                                </div>
                            </div>

                            <div class="space-y-3 mb-5 flex-1">
                                <div class="flex items-center gap-2">
                                    <span class="w-20 shrink-0 whitespace-nowrap text-sm text-slate-400 font-bold"><i class="fa-solid fa-pen-nib text-blue-400"></i> 繪圖進度</span>
                                    <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                                        <div class="h-full bg-gradient-to-r from-blue-400 to-blue-500 rounded-full" style="width: ${prog.draw}%"></div>
                                    </div>
                                    <span class="w-10 text-right text-sm font-bold text-slate-600">${prog.draw}%</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="w-20 shrink-0 whitespace-nowrap text-sm text-slate-400 font-bold"><i class="fa-solid fa-hammer text-orange-400"></i> 生產製造</span>
                                    <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                                        <div class="h-full bg-gradient-to-r from-orange-400 to-orange-500 rounded-full" style="width: ${prog.prod}%"></div>
                                    </div>
                                    <span class="w-10 text-right text-sm font-bold text-slate-600">${prog.prod}%</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="w-20 shrink-0 whitespace-nowrap text-sm text-slate-400 font-bold"><i class="fa-solid fa-paper-plane text-emerald-400"></i> 出貨現場</span>
                                    <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden">
                                        <div class="h-full bg-gradient-to-r from-emerald-400 to-emerald-500 rounded-full" style="width: ${prog.ship}%"></div>
                                    </div>
                                    <span class="w-10 text-right text-sm font-bold text-slate-600">${prog.ship}%</span>
                                </div>
                            </div>

                            <div class="flex gap-2 pt-3 border-t border-slate-50 mt-auto">
                                <button onclick="openProjectDetail('${project.id}', false, 'active')" class="flex-1 py-1.5 text-sm bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-lg font-bold transition-colors"><i class="fa-regular fa-eye mr-1"></i> 檢視</button>
                                <button onclick="openProjectDetail('${project.id}', true, 'active')" class="flex-1 py-1.5 text-sm bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg font-bold transition-colors"><i class="fa-solid fa-pen mr-1"></i> 編輯</button>
                                <button onclick="closeProject('${project.id}')" class="px-3 py-1.5 text-sm bg-white hover:bg-emerald-50 text-slate-300 hover:text-emerald-500 rounded-lg transition-colors border border-slate-100" title="結案歸檔"><i class="fa-solid fa-box-archive"></i></button>
                                <button onclick="deleteProject('${project.id}')" class="px-3 py-1.5 text-sm bg-white hover:bg-rose-50 text-slate-300 hover:text-rose-500 rounded-lg transition-colors border border-slate-100" title="刪除專案"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </div>`;
                    });
                }
                html += '</div></div>';
            });
            html += '</div>';
            if (!state.projects.some(p => p.status === 'active')) {
                html = `<div class="text-center text-slate-300 py-20 mt-10"><i class="fa-solid fa-ghost text-5xl mb-4 block"></i>目前沒有進行中的專案</div>`;
            }
            document.getElementById('main-content').innerHTML = html;
        }

        // --- 歷史典藏 ---
        // 歷史典藏的兩個頁籤：圖面與生產（原本的典藏）、五金市購品（已歸檔的市購品清單）
        function closedTabsHtml() {
            const sub = state.closedSub || 'drawing';
            const tab = (k, icon, label) => `<button onclick="switchClosedSub('${k}')" class="px-6 py-2.5 font-bold rounded-xl transition-all ${sub === k ? 'bg-indigo-50 text-indigo-600 border border-indigo-200' : 'bg-white text-slate-500 hover:bg-slate-50 border border-slate-200'}"><i class="fa-solid ${icon} mr-2"></i>${label}</button>`;
            return `<div class="flex gap-3 mb-6">${tab('drawing', 'fa-compass', '圖面與生產')}${tab('parts', 'fa-screwdriver-wrench', '五金市購品')}</div>`;
        }
        function switchClosedSub(sub) {
            if (window.SG && !SG.canLeave()) return;
            state.closedSub = sub;
            if (sub === 'parts') {
                const el = document.getElementById('main-content');
                el.innerHTML = closedTabsHtml() + '<div id="sg-archive"></div>';
                SG.mount(document.getElementById('sg-archive'), 'archive');
            } else {
                renderClosed();
            }
        }
        function renderClosed(targetYear) {
            const availableYears = [...new Set(state.closedProjects.map(p => '20' + p.id.substring(1, 3)))].sort((a,b) => b-a);
            
            if(availableYears.length === 0) {
                document.getElementById('main-content').innerHTML = closedTabsHtml() + `<div class="text-center text-slate-400 py-20 mt-10"><i class="fa-solid fa-box-open text-6xl mb-4 block"></i>目前尚無任何歷史典藏專案</div>`;
                return;
            }

            state.selectedYear = targetYear || availableYears[0];
            let html = `<div class="flex gap-3 mb-8 overflow-x-auto pb-2">`;
            
            availableYears.forEach(y => {
                if(y === state.selectedYear) {
                    html += `<button onclick="renderClosed('${y}')" class="px-5 py-2.5 rounded-xl font-black bg-indigo-600 text-white shadow-md shadow-indigo-200 transition-all">${y} 年度</button>`;
                } else {
                    html += `<button onclick="renderClosed('${y}')" class="px-5 py-2.5 rounded-xl font-bold bg-white text-slate-500 hover:bg-slate-50 border border-slate-200 transition-all">${y} 年度</button>`;
                }

        // --- 動態產生新專案邏輯 ---
        async function createNewProject() {
            const pwd = prompt("請輸入管理員密碼以建立新工案：");
            if (pwd === null) return;

            try {
                const isValid = await verifyPasswordFromBackend(pwd);
                if (!isValid) {
                    alert("密碼錯誤，無法建立新工案！");
                    return;
                }
            } catch(e) {
                alert('網路連線異常，請檢查。');
                return;
            }

            const idVal = document.getElementById('new-proj-id').value.trim().toUpperCase();
            const nameVal = document.getElementById('new-proj-name').value.trim();
            const areaVal = document.getElementById('new-proj-area').value;
            const deadlineVal = document.getElementById('new-proj-deadline').value;

            if(!idVal || !nameVal || areaVal === '格式錯誤' || areaVal === '') {
                alert('請確實填寫正確的專案編號 (首碼A/B/C/D) 與專案名稱！');
                return;
            }
            if(state.projects.find(p => p.id === idVal) || state.closedProjects.find(p => p.id === idVal)) {
                alert('專案編號已存在於進行中或歷史資料庫中，請更換！');
                return;
            }

            const checkedCbs = document.querySelectorAll('.template-equip-cb:checked');
            if(checkedCbs.length === 0) {
                alert('請至少勾選一項設備模板！');
                return;
            }

            let treeStruct = {}; 
            checkedCbs.forEach(cb => {
                let [m, med, eq] = cb.value.split('-').map(Number);
                if(!treeStruct[m]) treeStruct[m] = {};
                if(!treeStruct[m][med]) treeStruct[m][med] = [];
                treeStruct[m][med].push(eq);
            });

            let newMajors = [];
            Object.keys(treeStruct).forEach(mStr => {
                let m = parseInt(mStr);
                let templateMaj = state.templateMajors[m];
                let newMaj = { name: templateMaj.name, mediums: [] };

                Object.keys(treeStruct[m]).forEach(medStr => {
                    let med = parseInt(medStr);
                    let templateMed = templateMaj.mediums[med];
                    let newMed = { 
                        name: templateMed.name, 
                        weight: templateMed.weight || 0, 
                        hasProduction: templateMed.hasProduction !== false,
                        hasShipping: templateMed.hasShipping !== false,
                        equipments: [] 
                    };

                    treeStruct[m][med].forEach(eqIdx => {
                        let templateEq = templateMed.equipments[eqIdx];
                        let newEq = { name: templateEq.name, details: [] };

                        templateEq.details.forEach(templateDet => {
                            newEq.details.push({
                                name: templateDet.name,
                                assemblyId: templateDet.assemblyId || '', 
                                bodyId: templateDet.bodyId || '', 
                                version: templateDet.version || '', 
                                qty: templateDet.qty || 1,
                                skipAssembly: templateDet.skipAssembly === true,
                                drawing: [false, false, false, false, false, false],
                                production: { checks: [false, false, false, false], inputs: { material: '', work: '' } },
                                shipping: [false, false, false]
                            });
                        });
                        newMed.equipments.push(newEq);
                    });
                    newMaj.mediums.push(newMed);
                });
                newMajors.push(newMaj);
            });

            const newProject = {
                id: idVal,
                name: nameVal,
                deadline: deadlineVal,
                area: areaVal,
                status: 'active',
                majors: newMajors
            };

            const btn = document.querySelector('button[onclick="createNewProject()"]');
            const origHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 藍圖繪製並上傳至雲端中...';
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}?action=saveProject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify(newProject)
                });
                const res = await safeParseJSON(response);
                if(res && res.status === 'success') {
                    state.projects.push(newProject);
                    alert(`成功！專案 [${idVal}] 已建立，並且自動套用了模板與寫入資料庫！`);
                    switchTab('dashboard');
                } else {
                    alert('資料庫寫入失敗：' + (res ? res.message : '伺服器回傳格式異常，請確認 GAS 部署是否正常。'));
                }
            } catch (error) {
                alert('網路連線異常，請稍後再試。\n錯誤：' + error.message);
            } finally {
                btn.innerHTML = origHtml;
                btn.disabled = false;
            }
        }

        async function syncTemplatesToBackend() {

        function openTemplateModal() {
            document.getElementById('template-modal').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('template-modal-content').classList.remove('scale-95');
                document.getElementById('template-modal-content').classList.add('scale-100');
            }, 10);
            renderTemplateTree();

        function closeTemplateModal() {
            document.getElementById('template-modal-content').classList.add('scale-95');

            setTimeout(() => {
                document.getElementById('template-modal').classList.add('hidden');
                if(state.currentTab === 'settings') renderSettings();
            }, 200);
        }

        function updateTemplateField(type, m, med, eq, det, field, value) {
            if (type === 'medium') {
                if (field === 'hasProduction' || field === 'hasShipping') {
                    state.templateMajors[m].mediums[med][field] = value;
                } else {
                    state.templateMajors[m].mediums[med][field] = parseFloat(value) || 0;
                }
            } else if (type === 'detail') {
                if (field === 'qty') {
                    state.templateMajors[m].mediums[med].equipments[eq].details[det][field] = parseInt(value) || 0;
                } else if (field === 'skipAssembly') {
                    state.templateMajors[m].mediums[med].equipments[eq].details[det][field] = value;
                } else {
                    state.templateMajors[m].mediums[med].equipments[eq].details[det][field] = value;
                }
            }
            syncTemplatesToBackend();
        }

            let html = '<div class="space-y-6">';
            state.templateMajors.forEach((maj, mIdx) => {
                html += `
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm">

        // 新增/編輯/刪除 模板節點
        function addTemplateMajor() {
            let name = prompt('請輸入「大類」名稱：\n(如：機構設計、電控系統)');
            if(name && name.trim()) {
                state.templateMajors.push({ name: name.trim(), mediums: [] });
                renderTemplateTree();
                syncTemplatesToBackend();
            }
        }
        function addTemplateNode(type, m, med, eq) {
            let name;
            let hasChanged = false;
            if(type === 'medium') {
                name = prompt(`新增「中類」於 [${state.templateMajors[m].name}] 底下：`);
                if(name && name.trim()) { state.templateMajors[m].mediums.push({ name: name.trim(), weight: 0, hasProduction: true, hasShipping: true, equipments: [] }); hasChanged = true; }
            } else if(type === 'equip') {
                name = prompt(`新增「設備」於 [${state.templateMajors[m].mediums[med].name}] 底下：`);
                if(name && name.trim()) { state.templateMajors[m].mediums[med].equipments.push({ name: name.trim(), details: [] }); hasChanged = true; }
            } else if(type === 'detail') {
                name = prompt(`新增「細項圖面」於 [${state.templateMajors[m].mediums[med].equipments[eq].name}] 底下：`);
                if(name && name.trim()) { state.templateMajors[m].mediums[med].equipments[eq].details.push({ name: name.trim(), assemblyId: '', bodyId: '', version: '', qty: 1, skipAssembly: false }); hasChanged = true; }
            }
            if(hasChanged) {
                renderTemplateTree();
                syncTemplatesToBackend();
            }
        }

        function editTemplateNode(type, m, med, eq, det) {
            let oldName, newName;
            if(type === 'major') {
                oldName = state.templateMajors[m].name;
                newName = prompt('修改「大類」名稱：', oldName);
                if(newName && newName.trim()) state.templateMajors[m].name = newName.trim();
            } else if(type === 'medium') {
                oldName = state.templateMajors[m].mediums[med].name;
                newName = prompt('修改「中類」名稱：', oldName);
                if(newName && newName.trim()) state.templateMajors[m].mediums[med].name = newName.trim();
            } else if(type === 'equip') {
                oldName = state.templateMajors[m].mediums[med].equipments[eq].name;
                newName = prompt('修改「設備」名稱：', oldName);
                if(newName && newName.trim()) state.templateMajors[m].mediums[med].equipments[eq].name = newName.trim();
            } else if(type === 'detail') {
                oldName = state.templateMajors[m].mediums[med].equipments[eq].details[det].name;
                newName = prompt('修改「細項圖面」名稱：', oldName);
                if(newName && newName.trim()) state.templateMajors[m].mediums[med].equipments[eq].details[det].name = newName.trim();
            }
            
            if(newName && newName.trim() && newName !== oldName) {
                renderTemplateTree();
                syncTemplatesToBackend();
            }
        }

        function deleteTemplateNode(type, m, med, eq, det) {
            if(!confirm('確定要刪除此項目嗎？其底下所有的設定都會一併消失。')) return;
            if(type === 'major') state.templateMajors.splice(m, 1);
            else if(type === 'medium') state.templateMajors[m].mediums.splice(med, 1);
            else if(type === 'equip') state.templateMajors[m].mediums[med].equipments.splice(eq, 1);
            else if(type === 'detail') state.templateMajors[m].mediums[med].equipments[eq].details.splice(det, 1);
            
            renderTemplateTree();
            syncTemplatesToBackend();
        }

        // ★ 模板項目調整順序：大類/中類/設備/細項圖面皆可上移(dir=-1)或下移(dir=1)
        function moveTemplateNode(type, dir, m, med, eq, det) {
            let arr, idx;
            if(type === 'major') { arr = state.templateMajors; idx = m; }
            else if(type === 'medium') { arr = state.templateMajors[m].mediums; idx = med; }
            else if(type === 'equip') { arr = state.templateMajors[m].mediums[med].equipments; idx = eq; }
            else if(type === 'detail') { arr = state.templateMajors[m].mediums[med].equipments[eq].details; idx = det; }
            else return;

            const newIdx = idx + dir;
            if(newIdx < 0 || newIdx >= arr.length) return;

            [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];

            renderTemplateTree();
            syncTemplatesToBackend();
        }

        // ★ 依「目前模板」的順序，自動排序專案內的大類/中類/設備/細項圖面。
        // 不論品項是專案建立當下就有的、或是後來透過「匯入模板」「手動新增」加進來的，
        // 只要名稱能對應到模板內的品項，就會依模板順序排列；
        // 模板裡已經找不到對應名稱的品項（例如完全自訂新增的品項），
        // 則維持原本的相對順序、排在同層級最後面，不會被搬動或遺失。
        function sortMajorsByTemplateOrder(majorsArr) {
            if(!majorsArr || !state.templateMajors) return;

            const sortByNameOrder = (list, orderedNames) => {
                const orderMap = new Map();
                orderedNames.forEach((name, i) => orderMap.set(name, i));
                list.sort((a, b) => {
                    const ia = orderMap.has(a.name) ? orderMap.get(a.name) : Infinity;
                    const ib = orderMap.has(b.name) ? orderMap.get(b.name) : Infinity;
                    return ia - ib;
                });
            };

            sortByNameOrder(majorsArr, state.templateMajors.map(m => m.name));

            majorsArr.forEach(maj => {
                const tMaj = state.templateMajors.find(t => t.name === maj.name);
                if(!tMaj) return;
                sortByNameOrder(maj.mediums, tMaj.mediums.map(m => m.name));

                maj.mediums.forEach(med => {
                    const tMed = tMaj.mediums.find(t => t.name === med.name);
                    if(!tMed) return;
                    sortByNameOrder(med.equipments, tMed.equipments.map(e => e.name));

                    med.equipments.forEach(eq => {
                        const tEq = tMed.equipments.find(t => t.name === eq.name);
                        if(!tEq) return;
                        sortByNameOrder(eq.details, tEq.details.map(d => d.name));
                    });
                });
            });
        }

        // --- 專案詳情頁 (Excel 表格視圖) ---
        function openProjectDetail(projectId, isEditMode, sourceList) {
            let project;
            if(sourceList === 'active') {
                project = state.projects.find(p => p.id === projectId);
            } else {
                project = state.closedProjects.find(p => p.id === projectId);
            }
            if(!project) return;
            
            state.tempEditData = JSON.parse(JSON.stringify(project));
            sortMajorsByTemplateOrder(state.tempEditData.majors);
            state.editingProjectId = projectId;
            state.isEditMode = isEditMode;
            state.hasUnsavedChanges = false; 
            
            document.getElementById('view-main').classList.add('hidden');
            document.getElementById('view-project-detail').classList.remove('hidden');

            document.getElementById('detail-project-id').innerHTML = isEditMode
                ? `${project.id} <button onclick="editProjectId()" title="修改工程案號" class="ml-1 text-indigo-300 hover:text-indigo-600 transition-colors align-middle"><i class="fa-solid fa-pen text-xs"></i></button>`
                : project.id;
            
            document.getElementById('detail-project-name').innerHTML = `
                ${project.name} ${sourceList === 'closed' ? ' <span class="text-slate-400 text-lg font-bold">(已歸檔)</span>' : ''}
                ${isEditMode ? `<button onclick="editProjectName()" class="ml-2 text-slate-300 hover:text-indigo-600 transition-colors align-middle" title="修改專案名稱"><i class="fa-solid fa-pen text-lg"></i></button>` : ''}
            `;
            
            renderDetailDeadline();
            const saveBtn = document.getElementById('btn-save-detail');
            const pdfBtn = document.getElementById('btn-export-pdf');
            
            if(!isEditMode) {
                saveBtn.style.display = 'none';
                pdfBtn.style.display = 'flex';
            } else {
                saveBtn.style.display = 'flex';
                pdfBtn.style.display = 'none';
            }

            updateDetailProgress(); 
            switchPhaseTab(state.activePhaseTab); 
        }

        function backToMain() {
            if (state.isEditMode && state.hasUnsavedChanges) {
                if (confirm("⚠️ 您有尚未儲存的進度變更！\n\n按下「確定」直接幫您儲存至雲端，\n按下「取消」則放棄這些變更並離開。")) {
                    saveProjectData();
                    return; 
                }
            }

            state.tempEditData = null;
            state.editingProjectId = null;
            state.hasUnsavedChanges = false;
            document.getElementById('view-project-detail').classList.add('hidden');
            document.getElementById('view-main').classList.remove('hidden');
            if(state.currentTab === 'dashboard') {
                renderDashboard();
            } else if (state.currentTab === 'closed') {
                renderClosed(state.selectedYear);
            }
        }

        function switchPhaseTab(phase) {
            state.activePhaseTab = phase;
            const tabs = {
                drawing: { el: document.getElementById('tab-drawing'), color: 'blue' },
                production: { el: document.getElementById('tab-production'), color: 'orange' },
                shipping: { el: document.getElementById('tab-shipping'), color: 'emerald' }
            };

            for (const [key, tab] of Object.entries(tabs)) {
                if (key === phase) {
                    tab.el.className = `px-6 py-2.5 font-bold text-${tab.color}-700 bg-${tab.color}-100 rounded-xl transition-all shadow-sm`;
                } else {
                    tab.el.className = `px-6 py-2.5 font-bold text-slate-500 hover:bg-slate-100 rounded-xl transition-all`;
                }
            }
            renderPhaseTable(phase);
        }

                `;

        function editProjectId() {
            const oldId = state.tempEditData.id;
            const newId = prompt("請輸入新的工程案號：", oldId);
            if (!newId || !newId.trim()) return;
            const trimmed = newId.trim().toUpperCase();
            if (trimmed === oldId) return;
            // 確認不與其他專案重複
            const allIds = [...state.projects, ...state.closedProjects].map(p => p.id);
            if (allIds.includes(trimmed)) {
                alert(`工程案號「${trimmed}」已存在，請使用不同的編號。`);
                return;
            }
            state.tempEditData.id = trimmed;
            state.editingProjectId = trimmed;
            document.getElementById('detail-project-id').innerHTML = 
                `${trimmed} <button onclick="editProjectId()" title="修改工程案號" class="ml-1 text-indigo-300 hover:text-indigo-600 transition-colors align-middle"><i class="fa-solid fa-pen text-xs"></i></button>`;
            markUnsaved();
        }

        function getEquipRowspan(equip) {
            return Math.max(1, equip.details.length);
        }
        function getMediumRowspan(medium) {
            let count = 0;
            if(medium.equipments.length === 0) return 1;
            medium.equipments.forEach(eq => count += getEquipRowspan(eq));
            return count;
        }
        function getMajorRowspan(major) {
            let count = 0;
            if(major.mediums.length === 0) return 1;
            major.mediums.forEach(med => count += getMediumRowspan(med));
            return count;
        }

        function renderPhaseTable(phase) {
            const container = document.getElementById('table-container');
            let isEdit = state.isEditMode;
            
            let columnsHTML = '';
            let checklist = CHECKLIST_TEMPLATES[phase];
            let colorClass = phase === 'drawing' ? 'blue' : (phase === 'production' ? 'orange' : 'emerald');

            const progressTh = (label, extraClass = 'col-progress') =>
                `<th class="border-b-2 border-slate-200 px-3 py-4 text-center text-${colorClass}-700 font-bold bg-${colorClass}-50 ${extraClass} leading-snug whitespace-normal">${label}</th>`;

            if (phase === 'drawing') {
                checklist.forEach(col => columnsHTML += progressTh(col));
                columnsHTML += `<th class="border-b-2 border-slate-200 px-2 py-4 text-center bg-blue-100 font-bold text-blue-700 w-16 leading-snug">全選</th>`;
            } else if (phase === 'production') {
                checklist.forEach(col => columnsHTML += progressTh(col));
                columnsHTML += progressTh('取料預估工', 'col-progress-input');
                columnsHTML += progressTh('製作預估工', 'col-progress-input');
            } else if (phase === 'shipping') {
                checklist.forEach(col => columnsHTML += progressTh(col));
                columnsHTML += progressTh('操作');
            }

            let html = '';
            if (isEdit) {
                html += `
                <div class="mb-4">
                    <button onclick="openAppendTemplateModal()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-4 py-2 rounded-xl font-bold text-sm transition-colors shadow-sm">
                        <i class="fa-solid fa-layer-group mr-1"></i> 從模板匯入設備
                    </button>
                </div>
                `;
            }

            html += `
            <div class="bg-white shadow-sm border-b border-r border-slate-100 w-max min-w-full relative">
            <table class="w-full text-sm border-collapse" id="data-table">
                <thead class="sticky-header">
                    <tr>
                        <th class="border-b-2 border-slate-200 px-1 py-4 text-center col-major bg-slate-50 font-bold text-slate-600">大類</th>
                        <th class="border-b-2 border-slate-200 px-4 py-4 text-left w-40 bg-slate-50 font-bold text-slate-600">中類 (權重%)</th>
                        <th class="border-b-2 border-slate-200 px-4 py-4 text-left w-40 bg-slate-50 font-bold text-slate-600">設備</th>
                        
                        <th class="border-b-2 border-slate-200 px-3 py-4 text-left w-24 bg-slate-50 font-bold text-slate-600">組裝編號</th>
                        <th class="border-b-2 border-slate-200 px-3 py-4 text-left w-24 bg-slate-50 font-bold text-slate-600">本體編號</th>
                        <th class="border-b-2 border-slate-200 px-3 py-4 text-center w-20 bg-slate-50 font-bold text-slate-600">版本</th>
                        
                        <th class="border-b-2 border-slate-200 px-4 py-4 text-left col-detail bg-slate-50 font-bold text-slate-600">細項圖面</th>
                        <th class="border-b-2 border-slate-200 px-3 py-4 text-center w-16 bg-slate-50 font-bold text-slate-600">數量</th>
                        
                        ${columnsHTML}
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
            `;

            state.tempEditData.majors.forEach((major, majIdx) => {
                let majRs = getMajorRowspan(major);
                let firstMaj = true;

                major.mediums.forEach((medium, medIdx) => {
                    let medRs = getMediumRowspan(medium);
                    let firstMed = true;
                    let medHasProd = medium.hasProduction !== false;
                    let medHasShip = medium.hasShipping !== false;

                    // ★ 修正：設備為空時仍渲染一列（顯示「尚無設備」）
                    if (medium.equipments.length === 0) {
                        html += renderTableRow(firstMaj, majRs, major.name, firstMed, medRs, medium.name, medium.weight, majIdx, medIdx, true, 1, '—', -1, null, null, null, phase, isEdit, medHasProd, medHasShip, true);
                        firstMaj = false; firstMed = false;
                        return; // continue to next medium
                    }

                    medium.equipments.forEach((equip, eqIdx) => {
                        let eqRs = getEquipRowspan(equip);
                        let firstEq = true;

                        if (equip.details.length === 0) {
                            html += renderTableRow(firstMaj, majRs, major.name, firstMed, medRs, medium.name, medium.weight, majIdx, medIdx, firstEq, eqRs, equip.name, eqIdx, null, null, null, phase, isEdit, medHasProd, medHasShip);
                            firstMaj = false; firstMed = false; firstEq = false;
                        } else {
                            equip.details.forEach((det, detIdx) => {
                                const pId = `${majIdx}-${medIdx}-${eqIdx}-${detIdx}`;
                                html += renderTableRow(firstMaj, majRs, major.name, firstMed, medRs, medium.name, medium.weight, majIdx, medIdx, firstEq, eqRs, equip.name, eqIdx, det, detIdx, pId, phase, isEdit, medHasProd, medHasShip);
                                firstMaj = false; firstMed = false; firstEq = false;
                            });
                        }
                    });
                });
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

            state.tempEditData.majors[majIdx].mediums[medIdx][field] = val;

                                ${isEdit ? `
