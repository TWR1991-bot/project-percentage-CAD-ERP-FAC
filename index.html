        // 動態編輯已建專案的節點
        function openAppendTemplateModal() {
            document.getElementById('append-template-list').innerHTML = generateTemplateChecklistHtml('append-template');
            document.getElementById('append-template-modal').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('append-template-content').classList.remove('scale-95');
                document.getElementById('append-template-content').classList.add('scale-100');
            }, 10);
        }

        function closeAppendTemplateModal() {
            document.getElementById('append-template-content').classList.add('scale-95');
            document.getElementById('append-template-content').classList.remove('scale-100');
            setTimeout(() => {
                document.getElementById('append-template-modal').classList.add('hidden');
            }, 200);
        }

        function confirmAppendTemplate() {
            const checkedCbs = document.querySelectorAll('.append-template-cb:checked');
            if(checkedCbs.length === 0) {
                alert('請至少勾選一項設備！');
                return;
            }

            let treeStruct = {}; 
            checkedCbs.forEach(cb => {
                let [m, med, eq] = cb.value.split('-').map(Number);
                if(!treeStruct[m]) treeStruct[m] = {};
                if(!treeStruct[m][med]) treeStruct[m][med] = [];
                treeStruct[m][med].push(eq);
            });

            let addedMediums = 0;

            Object.keys(treeStruct).forEach(mStr => {
                let m = parseInt(mStr);
                let templateMaj = state.templateMajors[m];
                
                let targetMaj = state.tempEditData.majors.find(x => x.name === templateMaj.name);
                if (!targetMaj) {
                    targetMaj = { name: templateMaj.name, mediums: [] };
                    state.tempEditData.majors.push(targetMaj);
                }

                Object.keys(treeStruct[m]).forEach(medStr => {
                    let med = parseInt(medStr);
                    let templateMed = templateMaj.mediums[med];
                    
                    let targetMed = targetMaj.mediums.find(x => x.name === templateMed.name);
                    if (!targetMed) {
                        targetMed = { 
                            name: templateMed.name, 
                            weight: templateMed.weight || 0, 
                            hasProduction: templateMed.hasProduction !== false,
                            hasShipping: templateMed.hasShipping !== false,
                            equipments: [] 
                        };
                        targetMaj.mediums.push(targetMed);
                        addedMediums++;
                    }

                    treeStruct[m][med].forEach(eqIdx => {
                        let templateEq = templateMed.equipments[eqIdx];
                        let newEq = { name: templateEq.name, details: [] };

                        templateEq.details.forEach(templateDet => {
                            newEq.details.push({
                                name: templateDet.name,
                                assemblyId: templateDet.assemblyId || '', 
                                bodyId: templateDet.bodyId || '', 
                                version: templateDet.version || '', 
                                qty: templateDet.qty || 1,
                                skipAssembly: templateDet.skipAssembly === true,
                                drawing: [false, false, false, false, false, false],
                                production: { checks: [false, false, false, false], inputs: { material: '', work: '' } },
                                shipping: [false, false, false]
                            });
                        });
                        targetMed.equipments.push(newEq);
                    });
                });
            });

            sortMajorsByTemplateOrder(state.tempEditData.majors);

            closeAppendTemplateModal();
            renderPhaseTable(state.activePhaseTab);
            markUnsaved();
            
            if (addedMediums > 0) {
                alert('已匯入新項目！\n請注意檢查並調整「中類預設權重」，以確保總合為 100%。');
            }
        }

        function addProjectNode(type, m, med, eq) {
            let name;
            let hasChanged = false;
            if(type === 'detail') {
                name = prompt(`新增「細項圖面」於 [${state.tempEditData.majors[m].mediums[med].equipments[eq].name}] 底下：`);
                if(name && name.trim()) { 
                    state.tempEditData.majors[m].mediums[med].equipments[eq].details.push({ 
                        name: name.trim(), assemblyId: '', bodyId: '', version: '', qty: 1, skipAssembly: false,
                        drawing: [false, false, false, false, false, false],
                        production: { checks: [false, false, false, false], inputs: { material: '', work: '' } },
                        shipping: [false, false, false]
                    }); 
                    hasChanged = true; 
                }
            } else if(type === 'equip') {
                name = prompt(`新增「設備」於 [${state.tempEditData.majors[m].mediums[med].name}] 底下：`);
                if(name && name.trim()) { state.tempEditData.majors[m].mediums[med].equipments.push({ name: name.trim(), details: [] }); hasChanged = true; }
            } else if(type === 'medium') {
                name = prompt(`新增「中類」於 [${state.tempEditData.majors[m].name}] 底下：`);
                if(name && name.trim()) { state.tempEditData.majors[m].mediums.push({ name: name.trim(), weight: 0, hasProduction: true, hasShipping: true, equipments: [] }); hasChanged = true; }
            } else if(type === 'major') {
                name = prompt('請輸入「大類」名稱：');
                if(name && name.trim()) { state.tempEditData.majors.push({ name: name.trim(), mediums: [] }); hasChanged = true; }
            }

            if(hasChanged) {
                sortMajorsByTemplateOrder(state.tempEditData.majors);
                renderPhaseTable(state.activePhaseTab);
                markUnsaved(); 
            }
        }

        function editProjectNode(type, m, med, eq) {
            let oldName, newName;
            if(type === 'major') {
                oldName = state.tempEditData.majors[m].name;
                newName = prompt('修改「大類」名稱：', oldName);
                if(newName && newName.trim()) state.tempEditData.majors[m].name = newName.trim();
            } else if(type === 'medium') {
                oldName = state.tempEditData.majors[m].mediums[med].name;
                newName = prompt('修改「中類」名稱：', oldName);
                if(newName && newName.trim()) state.tempEditData.majors[m].mediums[med].name = newName.trim();
            } else if(type === 'equip') {
                oldName = state.tempEditData.majors[m].mediums[med].equipments[eq].name;
                newName = prompt('修改「設備」名稱：', oldName);
                if(newName && newName.trim()) state.tempEditData.majors[m].mediums[med].equipments[eq].name = newName.trim();
            }
            
            if(newName && newName.trim() && newName !== oldName) {
                renderPhaseTable(state.activePhaseTab);
                markUnsaved(); 
            }
        }

        function deleteProjectNode(type, m, med, eq, det) {
            if(!confirm('確定要刪除此項目嗎？其底下的所有設定與進度都會一併移除！')) return;
            
            if(type === 'major') state.tempEditData.majors.splice(m, 1);
            else if(type === 'medium') state.tempEditData.majors[m].mediums.splice(med, 1);
            else if(type === 'equip') state.tempEditData.majors[m].mediums[med].equipments.splice(eq, 1);
            else if(type === 'detail') state.tempEditData.majors[m].mediums[med].equipments[eq].details.splice(det, 1);
            
            renderPhaseTable(state.activePhaseTab);
            markUnsaved(); 
        }

        function getDetailObj(pId) {
            const [maj, med, eq, det] = pId.split('-').map(Number);
            return state.tempEditData.majors[maj].mediums[med].equipments[eq].details[det];
        }

        function markUnsaved() {
            if (!state.isEditMode) return;
            state.hasUnsavedChanges = true;
            updateDetailProgress();
        }
        
        function updateDetailField(pId, field, val) {
            const detail = getDetailObj(pId);
            detail[field] = val;
            markUnsaved();
        }

        function toggleCheck(pId, phase, idx, isChecked) {
            const detail = getDetailObj(pId);
            if (phase === 'draw') detail.drawing[idx] = isChecked;
            if (phase === 'prod') detail.production.checks[idx] = isChecked;
            if (phase === 'ship') detail.shipping[idx] = isChecked;
            markUnsaved();
        }

        function toggleSkipAssembly(pId, skip) {
            const detail = getDetailObj(pId);
            detail.skipAssembly = skip;
            if (skip) detail.production.checks[2] = false;
            markUnsaved();
            renderPhaseTable('production');
        }

        function selectAllShipping(pId) {
            const detail = getDetailObj(pId);
            detail.shipping = [true, true, true];
            markUnsaved();
            renderPhaseTable('shipping'); 
        }

        function updateInput(pId, type, val) {
            const detail = getDetailObj(pId);
            detail.production.inputs[type] = val;
            markUnsaved();
        }

        function updateWeight(majIdx, medIdx, val) {
            state.tempEditData.majors[majIdx].mediums[medIdx].weight = parseFloat(val) || 0;
            markUnsaved();
        }

        function updateDetailProgress() {
            const prog = calculateProgress(state.tempEditData);
            
            document.getElementById('detail-prog-draw').innerText = prog.draw + '%';
            document.getElementById('detail-prog-prod').innerText = prog.prod + '%';
            document.getElementById('detail-prog-ship').innerText = prog.ship + '%';
            document.getElementById('detail-prog-total').innerText = prog.total + '%';

            const weightBox = document.getElementById('detail-weight-box');
            const weightText = document.getElementById('detail-weight-text');
            const warning = document.getElementById('detail-weight-warning');
            const saveBtn = document.getElementById('btn-save-detail');

            weightText.innerText = prog.weightSum + '%';

            if (prog.weightSum !== 100) {
                weightBox.classList.replace('bg-emerald-50', 'bg-rose-50');
                weightBox.classList.replace('border-emerald-200', 'border-rose-200');
                weightText.classList.replace('text-emerald-600', 'text-rose-600');
                weightBox.querySelector('.w-10').classList.replace('bg-emerald-100', 'bg-rose-100');
                weightBox.querySelector('.w-10').classList.replace('text-emerald-600', 'text-rose-600');
                warning.classList.remove('hidden');
                
                if(state.isEditMode) {
                    saveBtn.disabled = true;
                    saveBtn.classList.replace('bg-indigo-600', 'bg-slate-300');
                    saveBtn.classList.replace('bg-amber-500', 'bg-slate-300');
                    saveBtn.classList.replace('hover:bg-indigo-700', 'hover:bg-slate-300');
                    saveBtn.classList.replace('hover:bg-amber-600', 'hover:bg-slate-300');
                    saveBtn.classList.remove('shadow-md', 'shadow-indigo-200', 'hover:-translate-y-0.5', 'ring-4', 'ring-amber-200');
                    saveBtn.classList.add('cursor-not-allowed');
                    saveBtn.innerHTML = '<i class="fa-solid fa-lock"></i> 權重錯誤';
                }
            } else {
                weightBox.classList.replace('bg-rose-50', 'bg-emerald-50');
                weightBox.classList.replace('border-rose-200', 'border-emerald-200');
                weightText.classList.replace('text-rose-600', 'text-emerald-600');
                weightBox.querySelector('.w-10').classList.replace('bg-rose-100', 'bg-emerald-100');
                weightBox.querySelector('.w-10').classList.replace('text-rose-600', 'text-emerald-600');
                warning.classList.add('hidden');

                if(state.isEditMode) {
                    saveBtn.disabled = false;
                    saveBtn.classList.remove('bg-slate-300', 'hover:bg-slate-300', 'cursor-not-allowed');
                    saveBtn.classList.add('shadow-md', 'shadow-indigo-200', 'hover:-translate-y-0.5');
                    
                    if (state.hasUnsavedChanges) {
                        saveBtn.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> 尚未儲存 (請點擊)';
                        saveBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
                        saveBtn.classList.add('bg-amber-500', 'hover:bg-amber-600', 'ring-4', 'ring-amber-200');
                    } else {
                        saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> 儲存變更';
                        saveBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600', 'ring-4', 'ring-amber-200');
                        saveBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
                    }
                }
            }
        }

        async function saveProjectData() {
            // 找來源：先找進行中，再找歷史典藏
            let index = state.projects.findIndex(p => p.id === state.editingProjectId);
            let isClosed = false;
            if (index === -1) {
                index = state.closedProjects.findIndex(p => p.id === state.editingProjectId);
                isClosed = true;
            }
            if(index !== -1) {
                // 如果案號被修改，需要移除舊案號並用新案號寫入
                const oldId = state.editingProjectId;
                const newId = state.tempEditData.id;
                if (isClosed) {
                    state.closedProjects[index] = JSON.parse(JSON.stringify(state.tempEditData));
                } else {
                    state.projects[index] = JSON.parse(JSON.stringify(state.tempEditData));
                }
                // 案號若已更改，同步 editingProjectId
                state.editingProjectId = newId;

                const projectObj = isClosed ? state.closedProjects[index] : state.projects[index];
                
                const saveBtn = document.getElementById('btn-save-detail');
                const origHtml = saveBtn.innerHTML;
                saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 儲存至雲端...';
                saveBtn.disabled = true;

                try {
                    const response = await fetch(`${API_URL}?action=saveProject`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                        body: JSON.stringify(projectObj)
                    });
                    const res = await safeParseJSON(response);
                    
                    if(res && res.status === 'success') {
                        state.hasUnsavedChanges = false; 
                        alert('專案進度已成功同步至 Google Sheets！');
                        updateDetailProgress();
                    } else {
                        const msg = res ? res.message : '伺服器回傳格式異常';
                        alert('儲存失敗：' + msg + '\n\n如持續發生，請至 Google Apps Script 重新部署（建立新版本）。');
                    }
                } catch (error) {
                    alert('網路連線異常，請稍後再試。\n錯誤：' + error.message);
                } finally {
                    if (state.hasUnsavedChanges) {
                        saveBtn.innerHTML = origHtml;
                        saveBtn.disabled = false;
                    }
                }
            }
        }

        async function closeProject(id) {
            if(!confirm(`確定要把專案 [${id}] 結案並封存至歷史典藏館嗎？`)) return;

            const pwd = prompt("請輸入管理員密碼以確認結案歸檔：");
            if (pwd === null) return;

            try {
                const isValid = await verifyPasswordFromBackend(pwd);
                if (!isValid) {
                    alert("密碼錯誤，結案失敗！");
                    return;
                }
            } catch(e) {
                alert('網路連線異常，請檢查。');
                return;
            }

            const index = state.projects.findIndex(p => p.id === id);
            if(index > -1) {
                let proj = state.projects[index];
                const origStatus = proj.status;
                
                proj.status = 'closed';
                proj.closeDate = new Date().toISOString().split('T')[0];
                proj.progress = calculateProgress(proj);
                
                try {
                    const response = await fetch(`${API_URL}?action=saveProject`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                        body: JSON.stringify(proj)
                    });
                    const res = await safeParseJSON(response);
                    
                    if(res && res.status === 'success') {
                        state.closedProjects.push(proj);
                        state.projects.splice(index, 1);
                        renderDashboard();
                        alert('專案已順利結案並封存。');
                    } else {
                        proj.status = origStatus; 
                        alert('結案失敗：' + (res ? res.message : '伺服器回傳格式異常'));
                    }
                } catch (error) {
                    proj.status = origStatus; 
                    alert('網路連線異常，請稍後再試。\n錯誤：' + error.message);
                }
            }
        }

        // ★ 將歷史典藏專案還原為「進行中專案」
        async function restoreProject(id) {
            if(!confirm(`確定要將專案 [${id}] 從歷史典藏還原為「進行中專案」嗎？`)) return;

            const pwd = prompt("請輸入管理員密碼以確認還原：");
            if (pwd === null) return;

            try {
                const isValid = await verifyPasswordFromBackend(pwd);
                if (!isValid) {
                    alert("密碼錯誤，還原失敗！");
                    return;
                }
            } catch(e) {
                alert('網路連線異常，請檢查。');
                return;
            }

            const index = state.closedProjects.findIndex(p => p.id === id);
            if(index === -1) return;

            let proj = state.closedProjects[index];
            const origStatus = proj.status;
            const origCloseDate = proj.closeDate;

            proj.status = 'active';
            delete proj.closeDate;

            try {
                const response = await fetch(`${API_URL}?action=saveProject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify(proj)
                });
                const res = await safeParseJSON(response);

                if(res && res.status === 'success') {
                    state.projects.push(proj);
                    state.closedProjects.splice(index, 1);
                    renderClosed(state.selectedYear);
                    alert(`專案 [${id}] 已成功還原為進行中專案！`);
                } else {
                    proj.status = origStatus;
                    proj.closeDate = origCloseDate;
                    alert('還原失敗：' + (res ? res.message : '伺服器回傳格式異常'));
                }
            } catch (error) {
                proj.status = origStatus;
                proj.closeDate = origCloseDate;
                alert('網路連線異常，請稍後再試。\n錯誤：' + error.message);
            }
        }

        async function deleteProject(id) {
            const pwd = prompt(`警告：您即將永久刪除專案 [${id}]。\n請輸入管理員密碼 (將核對 Google Sheets 設定) 以確認刪除：`);
            if (pwd === null) return;

            try {
                const isValid = await verifyPasswordFromBackend(pwd);
                if (isValid) {
                    const response = await fetch(`${API_URL}?action=deleteProject&id=${encodeURIComponent(id)}`);
                    const res = await response.json();
                    
                    if(res.status === 'success') {
                        const index = state.projects.findIndex(p => p.id === id);
                        if(index > -1) {
                            state.projects.splice(index, 1);
                            renderDashboard();
                            alert(`專案 [${id}] 已成功從資料庫中永久刪除。`);
                        }
                    } else {
                        alert('刪除失敗：' + res.message);
                    }
                } else {
                    alert('密碼錯誤，刪除失敗！');
                }
            } catch(e) {
                alert('網路連線異常，請檢查。');
            }
        }

        async function verifyPasswordFromBackend(password) {
            if (!password || password.trim() === "") return false;
            try {
                const response = await fetch(`${API_URL}?action=verifyPassword&password=${encodeURIComponent(password)}`);
                const res = await safeParseJSON(response);
                if (!res || res.status !== 'success') {
                    alert('密碼驗證失敗：' + (res ? res.message : 'GAS 回傳異常，請確認部署是否正常。'));
                    return false;
                }
                return res.data.isValid === true;
            } catch(e) {
                alert('網路連線異常，無法驗證密碼：' + e.message);
                return false;
            }
        }

        function exportToPDF() {
            const btn = document.getElementById('btn-export-pdf');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 報表產生中...';
            
            const detailView = document.getElementById('view-project-detail');
            detailView.classList.add('exporting-pdf');
            document.body.classList.add('pdf-exporting-active');
            
            setTimeout(() => {
                const opt = {
                    margin:       0.3,
                    filename:     `專案報表_${state.editingProjectId}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    jsPDF:        { unit: 'in', format: 'a3', orientation: 'landscape' },
                    html2canvas:  { 
                        scale: 1.5, 
                        useCORS: true,
                        windowWidth: detailView.scrollWidth,
                        windowHeight: detailView.scrollHeight
                    }
                };

                html2pdf().set(opt).from(detailView).save().then(() => {
                    btn.innerHTML = originalText;
                    detailView.classList.remove('exporting-pdf');
                    document.body.classList.remove('pdf-exporting-active');
                });
            }, 300);
        }

        // 圖面進度全選 / 取消全選
        function toggleAllDrawing(pId, checkAll) {
            const [majIdx, medIdx, eqIdx, detIdx] = pId.split('-').map(Number);
            const det = state.tempEditData.majors[majIdx].mediums[medIdx].equipments[eqIdx].details[detIdx];
            det.drawing = det.drawing.map(() => checkAll);
            markUnsaved();
            renderPhaseTable('drawing');
        }

        // ★ 共用：安全解析 GAS 回傳 JSON，避免 GAS 回傳 HTML 錯誤頁時 crash
        async function safeParseJSON(response) {
            const text = await response.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                console.error('GAS 回傳非 JSON 內容：', text.substring(0, 300));
                return { status: 'error', message: 'GAS 回傳格式異常，可能需要重新部署。詳見 F12 Console。' };
            }
        }

        // ★ 載入資料：自動重試 3 次（GAS 冷啟動 / 偶發逾時很常見），每次最多等 40 秒
        async function fetchInitialData(attempt = 1) {
            const MAX_ATTEMPTS = 3;
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 40000);
            try {
                const response = await fetch(`${API_URL}?action=getInitialData&_t=${Date.now()}`, { signal: ctrl.signal });
                clearTimeout(timer);
                const result = await safeParseJSON(response);
                if (result.status !== 'success') throw new Error(result.message || '伺服器回傳異常');

                state.projects = result.data.projects || [];
                state.closedProjects = result.data.closedProjects || [];
                state.templateMajors = result.data.templateMajors || [];

                const loader = document.getElementById('global-loader');
                loader.classList.add('opacity-0');
                setTimeout(() => loader.classList.add('hidden'), 500);
                switchTab('dashboard');
            } catch (e) {
                clearTimeout(timer);
                const msg = e.name === 'AbortError' ? '連線逾時（超過 40 秒）' : e.message;
                console.error(`載入失敗（第 ${attempt} 次）：`, e);
                if (attempt < MAX_ATTEMPTS) {
                    await new Promise(r => setTimeout(r, 1500 * attempt));
                    return fetchInitialData(attempt + 1);
                }
                if (confirm(`載入資料庫失敗（已自動重試 ${MAX_ATTEMPTS} 次）\n原因：${msg}\n\n是否再試一次？`)) {
                    return fetchInitialData(1);
                }
            }
        }

        window.onload = () => {
            fetchInitialData();
        };

    </script>

    <!-- ===== 五金市購品模組（資料庫：市購品 Google 試算表，透過其 Apps Script 讀寫）===== -->
    <script>
(function(){
'use strict';
// ===== 市購品管理：核心邏輯（瀏覽器 / Node 共用） =====
const toNum=v=>{ if(v===null||v===undefined||v==='') return null; const n=Number(String(v).replace(/,/g,'')); return isNaN(n)?null:n; };

function tableToObjects(t){
  if(!t||!t.length) return {header:[],rows:[]};
  const header=t[0].map(h=>String(h).trim());
  const rows=t.slice(1).filter(r=>r.some(c=>String(c).trim()!=='')).map(r=>{const o={}; header.forEach((h,i)=>{ if(h) o[h]=r[i]==null?'':String(r[i]).trim(); }); return o;});
  return {header,rows};
}

function parseConfig(tabs){
  const settings={};
  tableToObjects(tabs['設定']).rows.forEach(r=>{ settings[r['項目']]=r['內容']; });
  const cats=tableToObjects(tabs['類別設定']).rows.map(r=>({
    key:r['類別'], title:r['表單名稱']||r['類別'], unit:r['預設單位']||'',
    qtyFields:String(r['數量欄位']||'').split(/[、,，]/).map(s=>s.trim()).filter(Boolean),
    order:toNum(r['排序'])||999, note:r['注意事項']||'', multiply:!/^(否|n|no|x)$/i.test(String(r['乘以設備數量']||'是').trim())
  })).filter(c=>c.key).sort((a,b)=>a.order-b.order);
  const dbs={};
  cats.forEach(c=>{
    const t=tableToObjects(tabs[c.key+'資料庫']);
    c.fields=t.header.filter(h=>h&&h!=='設備'&&h!=='部位');
    c.missingDb=!tabs[c.key+'資料庫'];
    const map={}; t.rows.forEach(r=>{ const n=r['設備']; if(n) (map[n]=map[n]||[]).push(r); });
    c.hasPart=t.header.includes('部位')&&t.rows.some(r=>r['部位']);
    dbs[c.key]=map;
  });
  const mt=tableToObjects(tabs['設備主檔']);
  const master=mt.rows.filter(r=>r['設備']).map((r,i)=>({
    order:toNum(r['排序'])||i+1, name:r['設備'], follow:r['跟隨主項']||'',
    mode:r['網站對應方式']||(r['跟隨主項']?'跟隨主項':'自動'), keys:r['網站名稱關鍵字']||'',
    qtyRule:r['數量算法']||'預設', fixed:r['固定數量']||'',
    cats:cats.filter(c=>/^(v|ˇ|˙|1|y|是|●|o)$/i.test(String(r[c.key]||'').trim())).map(c=>c.key)
  })).sort((a,b)=>a.order-b.order);
  const scheduleItems=tableToObjects(tabs['採購項目']).rows.filter(r=>r['項目']).map(r=>({item:r['項目'],lead:toNum(r['交期(天)']),
    link:r['對應市購品']||'', oldNames:String(r['舊名稱']||'').split(/[|｜]/).map(s=>s.trim()).filter(Boolean),
    sel:r['對應市購品']?'':(r['預設選配']===undefined?'V':(r['預設選配']||''))}));
  return {settings,cats,dbs,master,scheduleItems};
}

// 設備的有效選配/數量（跟隨主項者取主項）
function effEquip(cfg, proj, name, depth=0){
  const m=cfg.master.find(x=>x.name===name);
  if(m&&m.follow&&depth<5) return {...effEquip(cfg,proj,m.follow,depth+1),followed:m.follow};
  const e=(proj.equip||{})[name]||{};
  return {v:e.v||'',qty:toNum(e.qty),src:e.src||'',match:e.match||''};
}

// 計算一個類別的明細列（同一台設備可對到資料庫多列，例如左右兩組減速機）
function computeCategory(cfg, proj, catKey){
  const cat=cfg.cats.find(c=>c.key===catKey); if(!cat) return [];
  const db=cfg.dbs[catKey]||{}; const lines=(proj.lines||{})[catKey]||{};
  const out=[];
  cfg.master.forEach(m=>{
    if(!m.cats.includes(catKey)) return;
    const e=effEquip(cfg,proj,m.name);
    if(e.v!=='V') return;
    const list=db[m.name]&&db[m.name].length?db[m.name]:[null];
    list.forEach((d,idx)=>{
      const key=`${m.name}#${idx}`;
      const ln=lines[key]||(idx===0?lines[m.name]:null)||{};
      const row={equip:m.name,idx,count:list.length,key,part:d?(d['部位']||''):'',missing:!d,values:{},qty:{},calc:{},overridden:{},unit:(d&&d['單位'])||cat.unit,track:ln};
      cat.fields.forEach(f=>{ if(!cat.qtyFields.includes(f)) row.values[f]=d?d[f]:''; });
      cat.qtyFields.forEach(f=>{
        const per=d?toNum(d[f]):null; const q=e.qty;
        const c=per==null?null:(cat.multiply?(q!=null?per*q:null):per);
        row.calc[f]=c&&c!==0?c:null;
        const ov=ln.qty&&ln.qty[f]!==undefined&&ln.qty[f]!==null&&ln.qty[f]!==''?toNum(ln.qty[f]):null;
        row.qty[f]=ov!=null?ov:row.calc[f]; row.overridden[f]=ov!=null;
      });
      out.push(row);
    });
  });
  return out;
}

// ---- 圖面清單比對（沿用產生器邏輯） ----
function norm(s){
  return String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'').replace(/[（【\[]/g,'(').replace(/[）】\]]/g,')')
    .replace(/污/g,'汙').replace(/臺/g,'台').replace(/m³/g,'m3').replace(/[‐‑–—－]/g,'-');
}
function flattenProject(p){
  const items=[];
  (p.majors||[]).forEach((maj,mi)=>(maj.mediums||[]).forEach((med,di)=>(med.equipments||[]).forEach((eq,ei)=>{
    const details=(eq.details||[]).map((d,k)=>typeof d==='string'?{name:d,qty:1}:{name:d.name||`圖面${k+1}`,qty:(d.qty===0?0:(+d.qty||1))});
    items.push({id:`${mi}-${di}-${ei}`,major:maj.name,medium:med.name,name:eq.name,details});
  })));
  return items;
}
const splitKeys=s=>String(s||'').split(/[|｜]/).map(x=>x.trim()).filter(Boolean);
function matchKey(key,items,allowFuzzy){
  let eqPart=key,detPart=null;
  if(key.includes('>')) [eqPart,detPart]=key.split('>').map(s=>s.trim());
  const nk=norm(eqPart),nd=detPart?norm(detPart):null; let res=[];
  if(nd!==null){ items.forEach(it=>{ if(norm(it.name)===nk||norm(it.medium)===nk){ const ds=it.details.filter(d=>norm(d.name)===nd||norm(d.name).includes(nd)); if(ds.length) res.push({item:it,details:ds}); }}); return {res,fuzzy:false}; }
  items.forEach(it=>{ if(norm(it.name)===nk) res.push({item:it,details:it.details}); }); if(res.length) return {res,fuzzy:false};
  items.forEach(it=>{ const ds=it.details.filter(d=>norm(d.name)===nk); if(ds.length) res.push({item:it,details:ds}); }); if(res.length) return {res,fuzzy:false};
  if(!allowFuzzy) return {res,fuzzy:false};
  const cand=items.filter(it=>{const n=norm(it.name); return n.length>=2&&(n.includes(nk)||nk.includes(n));});
  if(new Set(cand.map(it=>norm(it.name))).size===1) return {res:cand.map(it=>({item:it,details:it.details})),fuzzy:true};
  return {res:[],fuzzy:false};
}
function qtyOf(matches,rule,fixed){
  if(rule==='固定') return toNum(fixed)||0;
  if(rule==='設備數') return new Set(matches.map(m=>m.item.id)).size;
  if(rule==='細項加總') return matches.reduce((s,m)=>s+m.details.reduce((a,d)=>a+d.qty,0),0);
  const byEq={}; matches.forEach(m=>{const mx=m.details.length?Math.max(...m.details.map(d=>d.qty)):1; byEq[m.item.id]=Math.max(byEq[m.item.id]||0,mx);});
  return Object.values(byEq).reduce((a,b)=>a+b,0);
}
// 回傳每台設備的建議 {name:{v,qty,status,match}} 與網站上沒用到的設備
function matchDrawings(cfg, siteProject){
  const items=flattenProject(siteProject); const used=new Set(); const out={};
  cfg.master.forEach(m=>{
    if(m.follow||m.mode==='跟隨主項'||m.mode==='不連動') return;
    const keys=m.mode==='指定'?splitKeys(m.keys):(splitKeys(m.keys).length?splitKeys(m.keys):[m.name]);
    let fuzzy=false; const matches=[]; const seen=new Set();
    keys.forEach(k=>{ const {res,fuzzy:f}=matchKey(k,items,m.mode==='自動'); if(f) fuzzy=true;
      res.forEach(r=>{ const kk=r.item.id+'|'+r.details.map(d=>d.name).join(','); if(!seen.has(kk)){seen.add(kk);matches.push(r);} }); });
    if(matches.length){ matches.forEach(r=>used.add(r.item.id));
      out[m.name]={v:'V',qty:qtyOf(matches,m.qtyRule,m.fixed),status:fuzzy?'guess':'ok',
        match:matches.map(r=>`${r.item.medium}／${r.item.name}`+(r.details.length&&r.details.length<r.item.details.length?'：'+r.details.map(d=>d.name+'×'+d.qty).join('、'):'')).join('；')};
    } else out[m.name]={v:'X',qty:null,status:'none',match:''};
  });
  return {result:out,unused:items.filter(it=>!used.has(it.id)),total:items.length};
}

async function apiGet(url, params, timeout=45000){
  if(url==='gas'){ const {action,...rest}=params||{}; const j=await gasCall(action,rest); if(j.status!=='success'){ const er=new Error(j.message||'伺服器回傳錯誤'); er.fatal=true; throw er; } return j.data; }
  const u=new URL(url); Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v)); u.searchParams.set('_t',Date.now());
  for(let i=1;i<=3;i++){
    const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),timeout);
    try{
      const r=await fetch(u.toString(),{signal:ctrl.signal}); clearTimeout(tm);
      if(r.status===404){ const er=new Error('HTTP 404'); er.fatal=true; throw er; }
      const txt=await r.text(); let j;
      try{ j=JSON.parse(txt); }catch(e){ throw new Error('回傳的不是資料（請確認 Apps Script 已部署為「所有人」可存取）'); }
      if(j.status!=='success'){ const er=new Error(j.message||'伺服器回傳錯誤'); er.fatal=true; throw er; }
      return j.data;
    }catch(e){ clearTimeout(tm); if(i===3||e.fatal) throw (e.name==='AbortError'?new Error('連線逾時'):e); await new Promise(r=>setTimeout(r,1200*i)); }
  }
}
async function apiPost(action, body){
  if(API==='gas') return gasCall(action,{},body);
  const r=await fetch(`${API}?action=${action}`,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body)});
  const txt=await r.text(); try{ return JSON.parse(txt); }catch(e){ throw new Error('伺服器回傳格式異常'); }
}

  const ok=await save(true); if(!ok) Object.assign(p,bak); render();
}

// ---- 市購品申請表 ----
function catCounts(){ const o={}; catsList().forEach(c=>{ const rs=rowsOf(c.key); o[c.key]={n:rs.length,miss:rs.filter(r=>r.missing).length,cut:rowsRaw(c.key).length-rs.length}; }); return o; }
function usedCats(){ return catsList().filter(c=>rowsOf(c.key).length); }



// ---- 採購時程表 ----
// 找出時程表某列對應的採購項目設定（比對名稱或舊名稱）
function schedCfg(item){ const n=norm(item); return S.cfg.scheduleItems.find(x=>norm(x.item)===n||x.oldNames.some(o=>norm(o)===n)); }
// 依「對應市購品」判斷這個工案是否需要（回傳 null 代表沒有連動）
function linkHit(link){
  if(!link) return null;
  // 寫法：「類別」「類別：關鍵字1/關鍵字2」「設備：關鍵字」；「/」代表任一符合，「+」代表全部都要有；多組條件用「、」分隔，任一組成立即勾選
  const parts=String(link).split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
  const hits=[];
  const selEquip=()=>S.cfg.master.filter(m=>effEquip(S.cfg,S.proj,m.name).v==='V').map(m=>m.name);
  parts.forEach(pt=>{
    const [head,kw]=pt.split(/[:：]/).map(x=>(x||'').trim());
    const raw=(kw||'').trim();
    if(head==='設備'){
      const eq=selEquip();
      if(/[+＋]/.test(raw)){
        const need=raw.split(/[+＋]/).map(x=>x.trim()).filter(Boolean);
        const found=need.map(k=>eq.filter(n=>norm(n).includes(norm(k))));
        if(found.every(f=>f.length)) found.forEach(f=>hits.push(...f));
      } else {
        const kws=raw.split(/[\/／|]/).map(x=>x.trim()).filter(Boolean);
        eq.forEach(n=>{ if(kws.some(k=>norm(n).includes(norm(k)))) hits.push(n); });
      }
    } else {
      const kws=raw.split(/[\/／|]/).map(x=>x.trim()).filter(Boolean);
      rowsRaw(head).forEach(r=>{
        if(!kws.length||kws.some(k=>norm(Object.values(r.values||{}).join(' ')+' '+(r.part||'')).includes(norm(k)))) hits.push(r.equip);
      });
    }
  });
  return [...new Set(hits)];
}
// 時程表列的有效選配：有連動者自動判斷，除非使用者手動改過
function schedSel(r){
  const cfg=schedCfg(r.item); const hit=cfg?linkHit(cfg.link):null;
  if(hit===null) return {v:r.sel==='V'?'V':'',mode:'manual',hit:null,cfg};
  const auto=hit.length?'V':'';
  if(r.selManual) return {v:r.sel==='V'?'V':'',mode:(r.sel==='V'?'V':'')===auto?'auto':'override',auto,hit,cfg};
  return {v:auto,mode:'auto',auto,hit,cfg};
}
// 計算工案的申請／進貨進度（%）
function progressOf(p){
  const bak=S.proj; S.proj=p;
  try{
    const sel=(p.schedule||[]).filter(r=>schedSel(r).v==='V');
    if(!sel.length) return {apply:0,arrive:0,total:0};
    return {apply:Math.round(sel.filter(r=>r.applied==='V').length/sel.length*100),arrive:Math.round(sel.filter(r=>r.arrived==='V').length/sel.length*100),total:sel.length};
  } finally { S.proj=bak; }
}
// 工案列表：舊資料沒有進度欄時，在背景讀取工案算出進度（只顯示，不寫回）
async function backfillProgress(){
  if(S._backfilling) return; S._backfilling=true;
  try{
    for(const li of S.projects.filter(x=>x.applyPct==null)){
      try{ const p=await apiGet(API,{action:'getProject',id:li.id}); p.schedule=p.schedule||[]; p.equip=p.equip||{}; p.lines=p.lines||{}; migrateSchedule(p);
        const pg=progressOf(p); li.applyPct=pg.apply; li.arrivePct=pg.arrive; li._est=true; if(S.view==='list') render(); }catch(e){}
    }
  } finally { S._backfilling=false; }
}
// 舊工案：時程表項目若是舊名稱，改成新名稱
function migrateSchedule(p){
  (p.schedule||[]).forEach(r=>{ const c=schedCfg(r.item); if(c&&c.item!==r.item) r.item=c.item; });
}
function addDays(d,n){ const t=new Date(d); if(isNaN(t)||n==null||n==='') return ''; t.setDate(t.getDate()+(+n)); return t.toISOString().slice(0,10); }


// ---- 儲存 / 刪除 ----
async function save(silent){
  const p=S.proj; const btn=$('saveBtn'); if(btn){ btn.disabled=true; btn.textContent='儲存中…'; }
  try{
    p.progress=progressOf(p);
    const r=await apiPost('saveProject',{...p,baseRev:S.baseRev});
    if(r.status==='conflict'){ alert(r.message); return false; }
    if(r.status!=='success') throw new Error(r.message);
    S.baseRev=r.rev; p.rev=r.rev; S.dirty=false;
    const li=S.projects.find(x=>String(x.id)===String(p.id)); if(li){ Object.assign(li,{updated:r.updated,rev:r.rev,voltage:p.voltage,linkId:p.linkId,status:p.status||'進行中',archivedAt:p.archivedAt||'',applyPct:p.progress.apply,arrivePct:p.progress.arrive,_est:false}); }
    S.ro=isArchived(p)||!!S.viewOnly;
    const el=$('saveState'); if(el){ el.textContent='已儲存 '+r.updated; el.classList.remove('dirty'); }
    toast(silent?(isArchived(p)?'已結案歸檔，可在「歷史典藏 → 五金市購品」查看':'已取消歸檔，工案回到「五金市購品」'):'已儲存',silent?4000:2600); return true;
  }catch(e){ toast('儲存失敗：'+e.message,4500); return false; }
  finally{ const b=$('saveBtn'); if(b){ b.disabled=false; b.innerHTML='<i class="fa-solid fa-check"></i> 儲存變更'; } }
}
async function cardArchive(id){
  try{
    S.proj=await fetchProject(id); S.baseRev=S.proj.rev||0; S.dirty=false; S.cardAction=true;
    archiveDialog();
  }catch(e){ S.proj=null; toast('無法讀取工案：'+e.message,4000); }
}
async function cardUnarchive(id){
  if(!confirm(`確定要將「${id}」的五金市購品清單取消歸檔，回到「五金市購品」嗎？\n申請表會改回使用最新的資料庫規格。`)) return;
  try{
    const p=await fetchProject(id); S.proj=p; S.baseRev=p.rev||0;
    delete p.archive; p.status='進行中'; p.archivedAt='';
    await save(true);
  }catch(e){ toast('取消歸檔失敗：'+e.message,4000); }

async function cardDelete(id){

async function exportExcel(only){
  try{ await loadXLSX(); }catch(e){ toast('匯出元件載入失敗，請確認網路'); return; }
  const cfg=S.cfg,p=S.proj,wb=XLSX.utils.book_new();

    if(cat.note) aoa.push([],['※注意事項'],...cat.note.split('\n').map(l=>[l]));

    XLSX.utils.book_append_sheet(wb,ws,cat.key.slice(0,31));
  });
  if(only){ XLSX.writeFile(wb,`${only}申請表_${p.id}-${String(p.name).replace(/[\\/:*?"<>|]/g,'_')}.xlsx`); return; }
  const sc=[['#','選配','項目','實際申請日','申請完成','交期(天)','預計進貨日','進貨完成','採購廠商','備註']].concat(p.schedule.map((r,i)=>[i+1,schedSel(r).v,r.item,r.applyDate,r.applied,r.lead,r.eta||(/^\d{4}-\d{2}-\d{2}$/.test(r.applyDate||'')?addDays(r.applyDate,r.lead):''),r.arrived,r.vendor,r.note]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sc),'採購時程表');
  XLSX.writeFile(wb,`市購品清單_${p.id}-${String(p.name).replace(/[\\/:*?"<>|]/g,'_')}.xlsx`);
}

// 取得（必要時建立）明細列紀錄；舊資料以設備名稱為鍵者自動搬到「設備#0」
function lineOf(key){
  const p=S.proj; const L=(p.lines[S.cat]=p.lines[S.cat]||{});
  if(!L[key]){ const nm=key.replace(/#\d+$/,''); if(key.endsWith('#0')&&L[nm]){ L[key]=L[nm]; delete L[nm]; } else L[key]={}; }
  return L[key];
}

function bar(label,icon,color,pct){
  return `<div class="flex items-center gap-2"><span class="w-20 shrink-0 whitespace-nowrap text-sm text-slate-400 font-bold"><i class="fa-solid ${icon} ${color==='blue'?'text-blue-400':color==='orange'?'text-orange-400':'text-emerald-400'}"></i> ${label}</span>
    <div class="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-${color}-400 to-${color}-500 rounded-full" style="width:${pct||0}%"></div></div>
    <span class="w-10 text-right text-sm font-bold text-slate-600">${pct==null?'…':pct+'%'}</span></div>`;
}

// ---- 對話框（樣式同專案進度掌控的模板 Modal）----
function modal(o){
  if(typeof o==='string') o={title:'',body:o};
  $('sg-dialog').innerHTML=`<header class="bg-gradient-to-r from-indigo-500 to-purple-600 p-6 flex justify-between items-center text-white shrink-0">
      <div><h3 class="text-xl font-black tracking-tight">${o.title||''}</h3>${o.sub?`<p class="text-indigo-100 text-sm mt-1">${o.sub}</p>`:''}</div>
      <button data-close class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition-colors"><i class="fa-solid fa-xmark text-xl"></i></button>
    </header>
    <div class="flex-1 overflow-y-auto p-6 bg-slate-50/50 text-slate-600" style="max-height:62vh">${o.body||''}</div>
    ${o.foot?`<div class="p-5 bg-white border-t border-slate-100 flex justify-end gap-3 shrink-0">${o.foot}</div>`:''}`;
  const m=$('sg-modal'); m.classList.remove('hidden'); m.classList.add('flex');
  m.querySelector('[data-close]').onclick=closeModal;
}
function closeModal(){ const m=$('sg-modal'); if(m){ m.classList.add('hidden'); m.classList.remove('flex'); } if(S.cardAction&&S.view!=='project'){ S.proj=null; S.cardAction=false; S.ro=false; } }

// ---- 版面切換：列表在主內容區，工案頁是覆蓋層（同專案詳情頁）----
function render(){
  _selCache=new WeakMap();
  if(S.view==='project'&&S.proj){ renderDetail(); return; }
  removeDetail();
  const root=$('sg-root'); if(!root) return;
  const v={setup:viewSetup,list:viewList,db:viewDb}[S.view]||viewList;
  root.innerHTML=v();
}
function removeDetail(){ const d=$('sg-detail'); if(d) d.remove(); }
function renderDetail(){
  let d=$('sg-detail');
  if(!d){
    d=document.createElement('div'); d.id='sg-detail';
    d.className='flex-1 flex flex-col h-full w-full bg-white z-30 absolute inset-0 rounded-l-3xl shadow-[-10px_0_30px_rgba(0,0,0,0.05)]';
    d.addEventListener('click',onClick); d.addEventListener('input',onInput); d.addEventListener('change',onChange);
    (document.querySelector('main')||document.body).appendChild(d);
  }
  const sc=$('sg-body'); const top=sc?sc.scrollTop:0;
  d.innerHTML=viewProject();
  const sc2=$('sg-body'); if(sc2&&S._keepScroll) sc2.scrollTop=top; S._keepScroll=true;
  afterProjectRender();
}
function markDirty(){ S.dirty=true; const el=$('saveState'); if(el){ el.innerHTML='<i class="fa-solid fa-circle text-[8px] mr-1"></i>有未儲存的修改'; el.className='text-sm font-bold text-amber-600'; } }

// ---- 第一次設定 ----
function viewSetup(){
  return `<div class="max-w-3xl"><div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-8">
    <div class="w-12 h-12 bg-indigo-100 text-indigo-500 rounded-2xl flex items-center justify-center text-2xl mb-6"><i class="fa-solid fa-plug"></i></div>
    <h3 class="text-2xl font-black text-slate-800 mb-2">連線市購品資料庫</h3>
    ${S.loadError?`<p class="mb-4 text-sm font-bold text-rose-500">連線失敗：${esc(S.loadError)}</p>`:''}
    <p class="text-slate-500 mb-6 leading-relaxed text-sm">工案與圖面清單直接使用本系統的資料，不需要設定。只需要市購品資料庫（Apps Script）的部署網址，設定一次即可。</p>
    <div class="flex gap-3"><input type="url" id="apiIn" placeholder="https://script.google.com/macros/s/……/exec" value="${esc(API)}" class="${TW.inputLg}"><button class="${TW.btnPri}" id="apiSave">連線</button></div>
    <p class="text-xs text-slate-400 mt-4">若要全公司都免設定，請管理者把網址填進程式碼裡的 SG_API_URL。</p>
  </div></div>`;
}

// ---- 工案列表（同「圖面與生產」的 A/B/C/D 區塊）----
function viewList(){
  if(!S.cfg) return `<div class="text-center text-slate-300 py-16"><i class="fa-solid fa-spinner fa-spin text-3xl mb-3 block"></i>讀取市購品資料庫中…</div>`;
  if(S.projects.some(x=>x.applyPct==null)) setTimeout(backfillProgress,0);
  const all=mergedProjects();
  const siteClosed=p=>p.site&&p.site._closed;
  const arch=p=>(p.built&&p.status==='已歸檔')||(!p.built&&siteClosed(p));
  const yearOf=p=>'20'+String(p.id||'').substring(1,3);
  const groups={active:p=>!arch(p),built:p=>p.built&&!arch(p),todo:p=>!p.built&&!arch(p)};
  const cnt=Object.fromEntries(Object.entries(groups).map(([k,f])=>[k,all.filter(f).length]));
  let f=S.lfilter||'active'; if(!groups[f]) f='active';
  const q=S.q.trim().toLowerCase();
  let years=[];
  if(S.archMode){
    const archived=all.filter(p=>p.built&&p.status==='已歸檔');
    years=[...new Set(archived.map(yearOf))].sort((a,b)=>b-a);
    if(!years.includes(S.archYear)) S.archYear=years[0];
  }
  const ps=all.filter(p=>(!q||(p.id+(p.name||'')).toLowerCase().includes(q))&&(S.archMode?(p.built&&p.status==='已歸檔'&&yearOf(p)===S.archYear):groups[f](p)))
    .sort((a,b)=>(b.built-a.built)||String(a.id).localeCompare(String(b.id)));
  S.collapsed=S.collapsed||{};
  const card=p=>{
    const sp=p.site||{}; const isArch=arch(p); const th=areaTheme(blockOf(p));
    const dl=sp.deadline?(typeof renderDeadlineBadge==='function'?renderDeadlineBadge(sp.deadline,isArch):`<span class="text-xs text-slate-400">交期 ${esc(sp.deadline)}</span>`):'';
    const pct=p.applyPct;
    const ring=p.built?`<div class="relative w-14 h-14 flex items-center justify-center shrink-0">
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36"><path class="text-slate-100" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
        <path class="text-indigo-500 circle-progress drop-shadow-sm" stroke-dasharray="${pct||0}, 100" stroke-width="4" stroke="currentColor" fill="none" stroke-linecap="round" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/></svg>
        <div class="absolute text-sm font-black text-slate-700">${pct==null?'…':pct+'%'}</div></div>`:'';
    let body, foot;
    if(p.built){
      body=`${bar('申請進度','fa-file-signature','blue',pct)}${bar('進貨進度','fa-truck','emerald',p.arrivePct)}
        <div class="flex items-center gap-2 text-xs text-slate-400 font-bold pt-1">${isArch?`<i class="fa-solid fa-box-archive"></i> 已歸檔 ${esc(p.archivedAt||'')}`:`<i class="fa-regular fa-clock"></i> 更新 ${esc(p.updated||'')}`}${!isArch&&siteClosed(p)?' '+badgeTW('warn','進度網站已結案，可歸檔'):''}</div>`;
      const ib=(attr,icon,hov,title)=>`<button ${attr}="${esc(p.id)}" class="px-3 py-1.5 text-sm bg-white ${hov} text-slate-300 rounded-lg transition-colors border border-slate-100" title="${title}"><i class="fa-solid ${icon}"></i></button>`;
      foot=isArch
        ? `<button data-view="${esc(p.id)}" class="flex-1 py-1.5 text-sm bg-slate-700 hover:bg-slate-800 text-white rounded-lg font-bold transition-colors"><i class="fa-solid fa-book-open mr-1"></i> 翻閱申請表</button>${ib('data-unarch','fa-rotate-left','hover:bg-emerald-50 hover:text-emerald-500','取消歸檔，回到五金市購品')}${ib('data-del','fa-trash-can','hover:bg-rose-50 hover:text-rose-500','刪除市購品清單')}`
        : `<button data-view="${esc(p.id)}" class="flex-1 py-1.5 text-sm bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-lg font-bold transition-colors"><i class="fa-regular fa-eye mr-1"></i> 檢視</button><button data-open="${esc(p.id)}" class="flex-1 py-1.5 text-sm bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-lg font-bold transition-colors"><i class="fa-solid fa-pen mr-1"></i> 編輯</button>${ib('data-arch','fa-box-archive','hover:bg-emerald-50 hover:text-emerald-500','結案歸檔')}${ib('data-del','fa-trash-can','hover:bg-rose-50 hover:text-rose-500','刪除市購品清單')}`;
    } else {
      body=`<div class="text-sm text-slate-400 font-bold py-2"><i class="fa-regular fa-circle-dot mr-1"></i>${isArch?'進度網站已結案，未建立市購品清單':'尚未建立市購品清單'}</div>`;
      foot=`<button data-create="${esc(p.id)}" class="flex-1 py-1.5 text-sm bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 rounded-lg font-bold transition-colors"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 從圖面清單建立</button>`;
    }
    return `<div class="bg-white border border-slate-100 p-5 rounded-2xl shadow-sm hover-lift relative overflow-hidden flex flex-col h-full ${(!p.built||isArch)?'opacity-75':''}">
      <div class="flex justify-between items-start mb-4"><div class="min-w-0 pr-2">
        <span class="text-sm font-bold ${th.tagText} ${th.tagBg} px-2 py-1 rounded-md">${esc(p.id)}</span>
        <h4 class="font-black text-lg text-slate-800 mt-2 tracking-tight truncate" title="${esc(p.name||'')}">${esc(p.name||'')}</h4>
        <div class="mt-1.5 flex items-center gap-2">${dl}${p.built&&p.voltage?`<span class="text-xs font-bold text-slate-400">${esc(p.voltage)}</span>`:''}</div>
      </div>${ring}</div>
      <div class="space-y-3 mb-5 flex-1">${body}</div>
      <div class="flex gap-2 pt-3 border-t border-slate-50 mt-auto">${foot}</div></div>`;
  };
  const blocks=['A','B','C','D','其他'];
  const sections=blocks.map(b=>{
    const list=ps.filter(p=>blockOf(p)===b); if(!list.length) return '';
    const th=areaTheme(b); const k=AREA_KEY[b]||'x';
    return `<div class="bg-white area-panel-${k} rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 overflow-hidden flex flex-col">
      <div data-blk="${b}" class="bg-slate-50 area-header-${k} px-8 py-5 flex justify-between items-center border-b border-slate-100 cursor-pointer select-none">
        <span class="font-bold text-lg text-slate-700 flex items-center gap-2"><div class="w-2 h-6 ${th.dot} rounded-full"></div> ${b==='其他'?'其他':b+'案'}</span>
        <span class="flex items-center gap-3"><span class="${th.badgeBg} ${th.badgeText} text-sm font-bold px-3 py-1 rounded-full">${list.length} 個${S.archMode?'歸檔':'工案'}</span><i class="fa-solid fa-chevron-${S.collapsed[b]?'right':'down'} text-slate-400"></i></span>
      </div>
      ${S.collapsed[b]?'':`<div class="p-6 bg-transparent grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4 gap-6">${list.map(card).join('')}</div>`}
    </div>`;
  }).join('');
  if(S.archMode&&!years.length) return `<div class="text-center text-slate-400 py-20 mt-10"><i class="fa-solid fa-box-open text-6xl mb-4 block"></i>目前尚無已歸檔的五金市購品清單</div>`;
  return `<div class="flex flex-col gap-6">
    <div class="flex flex-wrap items-center gap-3">
      ${S.archMode
        ? years.map(y=>`<button data-ay="${y}" class="px-5 py-2.5 rounded-xl transition-all ${y===S.archYear?'font-black bg-indigo-600 text-white shadow-md shadow-indigo-200':'font-bold bg-white text-slate-500 hover:bg-slate-50 border border-slate-200'}">${y} 年度</button>`).join('')
        : [['active','進行中',cnt.active],['built','已建立清單',cnt.built],['todo','尚未建立',cnt.todo]].map(([k,t,n])=>`<button data-lf="${k}" class="${TW.chip(f===k)}">${t} <span class="opacity-70 ml-1">${n}</span></button>`).join('')}
      <span class="flex-1"></span>
      <span class="text-xs font-bold text-slate-400"><i class="fa-solid fa-circle text-[8px] ${S.cfg?'text-emerald-500':'text-amber-500'} mr-1"></i>市購品資料庫 ${S.cfg?'已連線':'連線中'}</span>
      <div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i><input type="text" id="pq" placeholder="搜尋工案號碼或名稱" value="${esc(S.q)}" class="border border-slate-200 rounded-xl pl-9 pr-4 py-2 bg-white text-sm font-bold text-slate-700 focus:outline-none focus:border-indigo-400 w-64"></div>
      ${S.archMode?'':`<button id="newProj" class="${TW.btn}"><i class="fa-solid fa-plus"></i>手動新增工案</button>`}
    </div>
    ${ps.length?sections:`<div class="text-center text-slate-300 py-16"><i class="fa-solid fa-ghost text-4xl mb-3 block"></i>${S.archMode?'這個年度沒有歸檔的工案':'沒有符合的工案'}</div>`}
  </div>`;
}

// ---- 工案頁（同專案詳情頁版型）----
function viewProject(){
  const p=S.proj; if(!p) return '';
  const pg=progressOf(p); const nV=cfgCountV(); const nCats=usedCats().length;
  const tabs=[['equip','fa-list-check','設備清單'],['items','fa-file-invoice','市購品申請表'],['sched','fa-calendar-days','採購時程表']];
  const box=(cls,label,val,tc)=>`<div class="${cls} border rounded-2xl p-4 min-w-[120px] text-center"><div class="text-xs ${tc[0]} font-bold mb-1">${label}</div><div class="text-2xl font-black ${tc[1]}">${val}</div></div>`;
  return `<header class="bg-gradient-to-r from-slate-50 to-white text-slate-800 p-6 flex justify-between items-center shrink-0 border-b border-slate-100">
      <div class="flex items-center gap-4">
        <button id="back" class="sg-back w-10 h-10 rounded-full hover:bg-slate-100 flex items-center justify-center text-slate-500 transition-colors"><i class="fa-solid fa-arrow-left"></i></button>
        <div>
          <span class="text-sm font-bold text-indigo-500 bg-indigo-50 px-2 py-1 rounded-lg mr-2">${esc(p.id)}</span>
          <h3 class="text-2xl font-black inline-block tracking-tight">${esc(p.name)}</h3>
          ${S.ro?'':`<button id="rename" class="ml-1 text-slate-300 hover:text-indigo-500 transition-colors" title="修改工案名稱"><i class="fa-solid fa-pen text-sm"></i></button>`}
          <div class="mt-1.5 flex items-center gap-3 text-sm">
            <select id="pVolt" class="border border-slate-200 rounded-lg px-2 py-0.5 bg-white text-sm font-bold text-slate-600">${['220V','380V','440V'].map(v=>`<option${v===p.voltage?' selected':''}>${v}</option>`).join('')}</select>
            ${isArchived(p)?badgeTW('mute',`<i class="fa-solid fa-box-archive mr-1"></i>已於 ${esc(p.archivedAt||'')} 結案歸檔（唯讀）`):S.viewOnly?badgeTW('mute','<i class="fa-regular fa-eye mr-1"></i>檢視模式（唯讀）'):`<span id="saveState" class="text-sm font-bold ${S.dirty?'text-amber-600':'text-slate-400'}">${S.dirty?'<i class="fa-solid fa-circle text-[8px] mr-1"></i>有未儲存的修改':'已儲存'}</span>`}
          </div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button id="exportX" class="${TW.btn}"><i class="fa-solid fa-file-excel"></i>匯出 Excel</button>
        <button id="printAll" class="${TW.btn}"><i class="fa-solid fa-print"></i>列印全部</button>
        ${isArchived(p)?`<button id="unarchive" class="${TW.btn}"><i class="fa-solid fa-rotate-left"></i>取消歸檔</button>`
          :S.viewOnly?`<button id="toEdit" class="${TW.btnPri}"><i class="fa-solid fa-pen"></i> 編輯</button>`
          :`<button id="saveBtn" class="${TW.btnPri}"><i class="fa-solid fa-check"></i> 儲存變更</button>`}
      </div>
    </header>
    <div class="flex-1 flex flex-col overflow-hidden min-h-0">
      <div class="bg-white border-b border-slate-100 shrink-0 px-8 py-6">
        <div class="flex gap-4 items-center flex-wrap">
          ${box('bg-blue-50/50 border-blue-100','選配設備',nV+' 項',['text-blue-500','text-blue-600'])}
          ${box('bg-orange-50/50 border-orange-100','市購品申請表',nCats+' 張',['text-orange-500','text-orange-600'])}
          ${box('bg-emerald-50/50 border-emerald-100','申請進度',pg.apply+'%',['text-emerald-500','text-emerald-600'])}
          <div class="flex items-center mx-2 text-slate-300"><i class="fa-solid fa-chevron-right"></i></div>
          ${box('bg-slate-50 border-slate-200 shadow-sm','進貨進度',pg.arrive+'%',['text-slate-500','text-slate-800'])}
          <span class="flex-1"></span>
          ${S.ro?'':`<button id="delProj" class="text-sm text-slate-300 hover:text-rose-500 font-bold transition-colors"><i class="fa-solid fa-trash-can mr-1"></i>刪除這個工案</button>`}
        </div>
        <div class="flex gap-3 mt-6">${tabs.map(([k,icn,t])=>`<button data-ptab="${k}" class="px-6 py-2.5 font-bold rounded-xl transition-all ${S.ptab===k?'text-blue-700 bg-blue-100 shadow-sm':'text-slate-500 hover:bg-slate-100'}"><i class="fa-solid ${icn} mr-2"></i>${t}</button>`).join('')}</div>
      </div>
      <div class="flex-1 overflow-auto p-6 bg-slate-50" id="sg-body"><div id="ptabBody">${S.ptab==='equip'?tabEquip():S.ptab==='items'?tabItems():tabSched()}</div></div>
    </div>`;
}
function afterProjectRender(){
  if(!S.ro) return;
  document.querySelectorAll('#ptabBody input:not([type=search]), #ptabBody select, #ptabBody [data-ev], #pVolt').forEach(el=>el.disabled=true);
  document.querySelectorAll('#syncBtn, #addSched').forEach(el=>el.style.display='none');
}

// ---- 設備清單 ----
function tabEquip(){
  const cfg=S.cfg,p=S.proj;
  const rows=cfg.master.map(m=>({m,e:effEquip(cfg,p,m.name),raw:p.equip[m.name]||{}}));
  const cnt={all:rows.length,v:rows.filter(r=>r.e.v==='V').length,guess:rows.filter(r=>r.raw.status==='guess').length};
  const q=S.q.trim().toLowerCase();
  const show=r=>(!q||r.m.name.toLowerCase().includes(q))&&(S.efilter==='all'||(S.efilter==='v'&&r.e.v==='V')||(S.efilter==='x'&&r.e.v!=='V')||(S.efilter==='guess'&&r.raw.status==='guess'));
  const body=rows.filter(show).map(({m,e,raw})=>{
    const tags=m.cats.map(c=>`<span class="${TW.tag}">${esc(c)}</span>`).join('');
    const vx=`<div class="inline-flex rounded-lg overflow-hidden border border-slate-200">
      <button data-ev="V" data-n="${esc(m.name)}" class="px-3 py-1 text-sm font-black ${e.v==='V'?'bg-emerald-500 text-white':'text-slate-300 hover:bg-slate-100'}">V</button>
      <button data-ev="X" data-n="${esc(m.name)}" class="px-3 py-1 text-sm font-black ${e.v==='X'?'bg-slate-400 text-white':'text-slate-300 hover:bg-slate-100'}">X</button></div>`;
    const qty=`<input type="number" min="0" data-eq="${esc(m.name)}" value="${e.v==='V'&&e.qty!=null?fmt(e.qty):''}" ${e.v!=='V'?'disabled':''} class="${TW.input} w-20 text-center">`;
    let src='';
    if(raw.src==='圖面') src=`${raw.status==='guess'?badgeTW('warn','推測')+' ':''}${esc(raw.match||'')}`;
    else if(raw.src) src=badgeTW('mute',esc(raw.src));
    return `<tr class="hover:bg-slate-50 ${e.v==='V'?'':'opacity-60'}"><td class="${TW.td} text-slate-400 text-xs">${m.order}</td><td class="${TW.td} font-bold whitespace-nowrap">${esc(m.name)}</td><td class="${TW.td}">${vx}</td><td class="${TW.td}">${qty}</td><td class="${TW.td}">${tags}</td><td class="${TW.td} text-xs text-slate-400">${src}</td></tr>`;
  }).join('');
  const sync=p.drawingSync?`上次更新：${esc(p.drawingSync.at)}`:'尚未從圖面清單更新';
  return `<div class="flex flex-wrap items-center gap-3 mb-4">
      ${[['all','全部',cnt.all],['v','已選 V',cnt.v],['x','未選',cnt.all-cnt.v],['guess','推測待確認',cnt.guess]].map(([k,t,n])=>`<button data-ef="${k}" class="${TW.chip(S.efilter===k)}">${t} <span class="opacity-70 ml-1">${n}</span></button>`).join('')}
      <div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i><input type="text" id="eq" placeholder="搜尋設備" value="${esc(S.q)}" class="${TW.input} pl-9 py-1.5 w-52"></div>
      <span class="flex-1"></span><span class="text-xs text-slate-400 font-bold">${sync}</span>
      <button id="syncBtn" class="${TW.btnSoft}"><i class="fa-solid fa-rotate"></i>從圖面清單更新</button>
    </div>
    <div class="${TW.card} overflow-auto"><table class="w-full text-sm border-collapse"><thead class="sticky-header"><tr>

      <tbody>${body||`<tr><td colspan="6" class="text-center text-slate-300 py-10">沒有符合的設備</td></tr>`}</tbody></table></div>`;
}

function tabItems(){
  const cfg={...S.cfg,cats:catsList()}; const cc=catCounts();
  const mode=S.ro?'form':(S.imode||'form');
  if(S.cat!=='__all'&&(!S.cat||!cfg.cats.find(c=>c.key===S.cat))) S.cat=(cfg.cats.find(c=>cc[c.key].n)||cfg.cats[0]).key;
  const all=S.cat==='__all'; const cat=all?null:cfg.cats.find(c=>c.key===S.cat);
  const ordered=[...cfg.cats.filter(c=>cc[c.key].n),...cfg.cats.filter(c=>!cc[c.key].n)];
  const firstNone=ordered.findIndex(c=>!cc[c.key].n);
  const itemCls=(on,none)=>`w-full flex justify-between items-center px-3 py-2 rounded-lg text-sm text-left transition-colors ${on?'bg-indigo-50 text-indigo-600 font-bold':none?'text-slate-300 hover:bg-slate-50':'text-slate-600 hover:bg-slate-50 font-medium'}`;
  const list=`<div class="${TW.card} p-2 self-start sticky top-0">
      <button data-cat="__all" class="${itemCls(all,false)}"><span><i class="fa-solid fa-layer-group mr-2"></i>全部申請表</span><span class="text-xs text-slate-400">${usedCats().length} 張</span></button>
      <div class="h-px bg-slate-100 my-2"></div>
      ${ordered.map((c,i)=>{ const n=cc[c.key].n; return `${i===firstNone?'<div class="text-xs text-slate-300 font-bold px-3 pt-3 pb-1 border-t border-dashed border-slate-200 mt-2">未使用</div>':''}<button data-cat="${esc(c.key)}" class="${itemCls(c.key===S.cat,!n)}"><span>${esc(c.key)}</span>${n?`<span class="text-xs ${cc[c.key].miss?'text-amber-500':'text-slate-400'}" title="${cc[c.key].miss?cc[c.key].miss+' 項缺資料庫規格':''}${cc[c.key].cut?'（採購時程表取消 '+cc[c.key].cut+' 項）':''}">${n}${cc[c.key].cut?'<span class="text-slate-300"> /'+(n+cc[c.key].cut)+'</span>':''}${cc[c.key].miss?' <i class="fa-solid fa-triangle-exclamation"></i>':''}</span>`:`<span class="text-xs">${cc[c.key].cut?'時程表已取消':'此工案無'}</span>`}</button>`; }).join('')}
    </div>`;
  const modeSw=(all||S.ro)?(isArchived(S.proj)?badgeTW('mute','歸檔快照・唯讀'):''):`<div class="inline-flex bg-slate-100 rounded-xl p-1 gap-1">${[['form','申請表'],['edit','填寫數量與進貨']].map(([k,t])=>`<button data-imode="${k}" class="px-4 py-1.5 rounded-lg text-sm font-bold ${mode===k?'bg-white text-indigo-600 shadow-sm':'text-slate-500'}">${t}</button>`).join('')}</div>`;
  const bar=`<div class="flex items-center gap-3 mb-4">${modeSw}<span class="flex-1"></span>
      ${all?`<button id="printAll2" class="${TW.btn}"><i class="fa-solid fa-print"></i>列印全部</button><button id="exportAll2" class="${TW.btn}"><i class="fa-solid fa-file-excel"></i>匯出全部</button>`
           :`<button id="printCat" class="${TW.btn}"><i class="fa-solid fa-print"></i>列印</button><button id="exportCat" class="${TW.btn}"><i class="fa-solid fa-file-excel"></i>匯出 Excel</button>`}</div>`;
  let content;
  if(all){ const cs=usedCats(); content=cs.length?`<div class="sg-paperwrap bg-slate-100 rounded-2xl p-6 overflow-x-auto">${cs.map(c=>formHtml(c)).join('')}</div>`:`<div class="text-center text-slate-300 py-10">這個工案還沒有選任何設備</div>`; }
  else if(mode==='form') content=`<div class="sg-paperwrap bg-slate-100 rounded-2xl p-6 overflow-x-auto">${formHtml(cat)}</div>`;
  else content=editTable(cat);
  return `<div class="grid gap-5" style="grid-template-columns:210px minmax(0,1fr)">${list}<div class="min-w-0">${bar}${content}</div></div>`;

function editTable(cat){
  const rows=rowsOf(cat.key);
  if(!rows.length) return `<div class="${TW.card} text-center text-slate-400 py-10">${rowsRaw(cat.key).length?`採購時程表已取消${esc(cat.key)}，所以這張申請表不列入。到「採購時程表」重新勾選就會恢復。`:`這個工案沒有用到${esc(cat.key)}。到「設備清單」把相關設備設為 V 就會出現在這裡。`}</div>`;
  const head=['編號','設備'].concat(cat.hasPart?['部位']:[]).concat(cat.fields).concat(['單位']).concat(cat.qtyFields.map(f=>cat.qtyFields.length>1?`${f.replace('數量','')}出貨數量`:'出貨數量')).concat(['進貨日期','領料狀況','工案備註']);
  const body=rows.map((r,i)=>{
    const t=r.track||{}; const k=esc(r.key);
    const cells=cat.fields.map(f=>{
      if(cat.qtyFields.includes(f)) return `<td class="${TW.td}"><input type="number" min="0" data-lq="${k}" data-f="${esc(f)}" value="${fmt(r.qty[f])}" placeholder="${fmt(r.calc[f])}" title="${r.overridden[f]?'已手動修改，自動計算為 '+(fmt(r.calc[f])||'空白')+'；清空即恢復':'自動計算，可直接修改'}" class="${TW.input} w-20 text-center ${r.overridden[f]?'!border-amber-400 !bg-amber-50 !text-amber-700':''}"></td>`;
      return `<td class="${TW.td}">${esc(r.values[f]||'')}</td>`;
    }).join('');
    const ship=cat.qtyFields.map(f=>`<td class="${TW.td}"><input type="text" data-lt="${k}" data-k="ship" data-f="${esc(f)}" value="${esc((t.ship||{})[f]||'')}" class="${TW.input} w-20"></td>`).join('');
    return `<tr class="hover:bg-slate-50"><td class="${TW.td} text-slate-400 text-xs">${i+1}</td><td class="${TW.td} font-bold whitespace-nowrap">${esc(r.equip)}${r.missing?' '+badgeTW('warn','缺資料'):''}</td>${cat.hasPart?`<td class="${TW.td}">${esc(r.part)}</td>`:''}${cells}<td class="${TW.td}">${esc(r.unit)}</td>${ship}
      <td class="${TW.td}"><input type="date" data-lt="${k}" data-k="date" value="${esc(t.date||'')}" class="${TW.input}"></td>
      <td class="${TW.td}"><input type="text" list="statusList" data-lt="${k}" data-k="status" value="${esc(t.status||'')}" class="${TW.input} w-24"></td>
      <td class="${TW.td}"><input type="text" data-lt="${k}" data-k="note" value="${esc(t.note||'')}" class="${TW.input} w-36"></td></tr>`;
  }).join('');
  return `<p class="text-xs text-slate-400 font-bold mb-2">${rows.length} 項，${cat.multiply?'數量＝資料庫單台數量 × 設備數量':'數量直接取資料庫'}。數量格可直接改，清空即恢復自動計算。</p>
    <div class="${TW.card} overflow-auto"><table class="w-full text-sm border-collapse"><thead class="sticky-header"><tr>${head.map(h=>`<th class="${TW.th}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
    ${cat.note?`<div class="mt-3 text-xs text-slate-500 bg-white border border-slate-200 rounded-xl p-4 whitespace-pre-line"><b>※注意事項</b>\n${esc(cat.note)}</div>`:''}
    <datalist id="statusList"><option>未進貨</option><option>已進貨</option><option>部分領料</option><option>已領料</option></datalist>`;
}

// ---- 採購時程表 ----
function tabSched(){
  const sc=S.proj.schedule; const eff=sc.map(schedSel); const selRows=sc.filter((r,i)=>eff[i].v==='V');
  const pa=selRows.length?Math.round(selRows.filter(r=>r.applied==='V').length/selRows.length*100):0, pr=selRows.length?Math.round(selRows.filter(r=>r.arrived==='V').length/selRows.length*100):0;
  const nLinked=eff.filter(e=>e.hit!==null).length;
  const order=[...sc.keys()].filter(i=>eff[i].v==='V').concat([...sc.keys()].filter(i=>eff[i].v!=='V'));
  const nOn=order.filter(i=>eff[i].v==='V').length;
  const body=order.map((i,pos)=>{
    const r=sc[i]; const e=eff[i];
    const sep=(pos===nOn&&pos<order.length)?`<tr><td colspan="10" class="px-3 pt-5 pb-2 bg-slate-50 text-xs font-bold text-slate-400 border-b border-slate-200"><i class="fa-solid fa-ban mr-1"></i>未使用（${order.length-nOn} 項）　勾選「選配」即可移回上方</td></tr>`:'';
    const auto=/^\d{4}-\d{2}-\d{2}$/.test(r.applyDate||'')?addDays(r.applyDate,r.lead):'';
    const ck=(k)=>`<input type="checkbox" data-si="${i}" data-k="${k}" ${r[k]==='V'?'checked':''} class="w-4 h-4 accent-indigo-600">`;
    let tag='';
    if(e.hit!==null){
      const why=(e.hit.length?`符合：${e.hit.slice(0,6).join('、')}${e.hit.length>6?' 等 '+e.hit.length+' 項':''}`:'設備清單沒有符合的項目')+`\n條件：${e.cfg.link}`;
      tag=e.mode==='override'?`<button data-sreset="${i}" class="ml-1 text-[11px] font-bold px-1.5 py-0.5 rounded bg-amber-50 text-amber-600" title="已手動改過（自動判斷為${e.auto?'需要':'不需要'}），點一下恢復自動">手動 ↺</button>`
                             :`<span class="ml-1 text-[11px] font-bold px-1.5 py-0.5 rounded ${e.v?'bg-indigo-50 text-indigo-600':'bg-slate-100 text-slate-400'}" title="${esc(why)}">連動</span>`;
    }
    return `${sep}<tr class="hover:bg-slate-50 ${e.v==='V'?'':'opacity-50'}"><td class="${TW.td} text-slate-400 text-xs">${pos<nOn?pos+1:''}</td>
      <td class="${TW.td} whitespace-nowrap"><input type="checkbox" data-si="${i}" data-k="sel" ${e.v==='V'?'checked':''} class="w-4 h-4 accent-indigo-600 align-middle">${tag}</td>
      <td class="${TW.td}"><input type="text" data-si="${i}" data-k="item" value="${esc(r.item)}" class="${TW.input} w-56"></td>
      <td class="${TW.td}"><input type="text" data-si="${i}" data-k="applyDate" value="${esc(r.applyDate||'')}" placeholder="yyyy-mm-dd" class="${TW.input} w-28"></td>
      <td class="${TW.td} text-center">${ck('applied')}</td>
      <td class="${TW.td}"><input type="number" min="0" data-si="${i}" data-k="lead" value="${esc(r.lead)}" class="${TW.input} w-16 text-center"></td>
      <td class="${TW.td}"><input type="text" data-si="${i}" data-k="eta" value="${esc(r.eta||'')}" placeholder="${esc(auto||'yyyy-mm-dd')}" title="留空時依申請日＋交期自動推算" class="${TW.input} w-28"></td>
      <td class="${TW.td} text-center">${ck('arrived')}</td>
      <td class="${TW.td}"><input type="text" data-si="${i}" data-k="vendor" value="${esc(r.vendor||'')}" class="${TW.input} w-28"></td>
      <td class="${TW.td}"><input type="text" data-si="${i}" data-k="note" value="${esc(r.note||'')}" class="${TW.input} w-40"></td></tr>`;
  }).join('');
  return `<div class="flex flex-wrap items-center gap-6 mb-4">
      <div class="w-72">${bar('申請進度','fa-file-signature','blue',pa)}</div>
      <div class="w-72">${bar('進貨進度','fa-truck','emerald',pr)}</div>
      <span class="text-xs text-slate-400 font-bold">以勾選「選配」的 ${selRows.length} 項計算；${nLinked} 項與設備清單連動</span>
      <span class="flex-1"></span><button id="addSched" class="${TW.btn}"><i class="fa-solid fa-plus"></i>新增項目</button>
    </div>
    <div class="${TW.card} overflow-auto"><table class="w-full text-sm border-collapse"><thead class="sticky-header"><tr>${['#','選配','項目','實際申請日','申請完成','交期(天)','預計進貨日','進貨完成','採購廠商','備註'].map(h=>`<th class="${TW.th}">${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="mt-3 text-xs text-slate-400">標示「連動」的項目會依設備清單自動勾選：有用到就勾，沒用到就不勾。需要時可自己勾選或取消，會改標「手動」，點一下即可恢復自動。取消市購品項目（例如設備只換局部、不需要某些市購品）時，對應的申請表也會一起移到「未使用」。</p>`;
}

  }catch(e){ $('npSite').innerHTML=`<option value="">讀不到工案（${esc(e.message)}）</option>`; }

  $('npCancel').onclick=closeModal;

async function syncDrawings(auto){
  const p=S.proj;
  try{
    const site=await loadSite(true);
    let sp=site.find(x=>String(x.id)===String(p.linkId));
    if(!sp){
      modal({title:'選擇對應的工案',sub:'這個市購品清單還沒有連結到「圖面與生產」的工案。',
        body:`<select id="pickSite" class="${TW.inputLg}">${site.map(x=>`<option value="${esc(x.id)}"${String(x.id)===String(p.id)?' selected':''}>${esc(x.id)}　${esc(x.name||'')}</option>`).join('')}</select>`,
        foot:`<button id="psC" class="${TW.btn}">取消</button><button id="psO" class="${TW.btnPri}">使用這個工案</button>`});
      $('psC').onclick=closeModal; $('psO').onclick=()=>{p.linkId=$('pickSite').value; markDirty(); closeModal(); syncDrawings(auto);};
      return;
    }
    const {result,unused,total}=matchDrawings(S.cfg,sp);
    const changes=[];
    Object.entries(result).forEach(([name,r])=>{
      const cur=p.equip[name]||{};
      const curQ=cur.v==='V'?(cur.qty==null?null:+cur.qty):null, newQ=r.v==='V'?r.qty:null;
      const curV=cur.v==='V'?'V':'X';
      if(curV!==r.v||curQ!==newQ||(r.v==='V'&&(cur.match||'')!==r.match)) changes.push({name,cur,r,curQ,newQ,real:curV!==r.v||curQ!==newQ});
    });
    const rank=c=>c.r.v==='V'?(c.cur.v==='V'?1:0):2;
    const real=changes.filter(c=>c.real).sort((a,b)=>rank(a)-rank(b));
    modal({title:'<i class="fa-solid fa-rotate mr-2"></i>從圖面清單更新',sub:`${esc(sp.id)} ${esc(sp.name||'')}，圖面清單共 ${total} 項設備`,
      body:`${real.length?`<p class="text-xs text-slate-400 font-bold mb-3">勾選要套用的變更。「推測」是名稱不完全相同時猜的，請確認。</p>
        <div class="bg-white rounded-2xl border border-slate-100 overflow-hidden"><table class="w-full text-sm border-collapse"><thead><tr class="sg-th"><th class="px-3 py-2 text-left"><input type="checkbox" id="chkAll" checked></th><th class="px-3 py-2 text-left">設備</th><th class="px-3 py-2 text-left">目前</th><th class="px-3 py-2 text-left">圖面清單</th><th class="px-3 py-2 text-left">對到的圖面設備</th></tr></thead><tbody>
        ${real.map(c=>`<tr class="border-b border-slate-100"><td class="px-3 py-2"><input type="checkbox" class="chg" data-i="${changes.indexOf(c)}" checked></td><td class="px-3 py-2 font-bold whitespace-nowrap text-slate-700">${esc(c.name)}</td>
          <td class="px-3 py-2">${c.cur.v==='V'?'V':'X'} ${c.curQ!=null?'× '+fmt(c.curQ):''}</td>
          <td class="px-3 py-2 font-black text-slate-700">${c.r.v} ${c.newQ!=null?'× '+fmt(c.newQ):''} ${c.r.status==='guess'?badgeTW('warn','推測'):''}</td>
          <td class="px-3 py-2 text-xs text-slate-400">${esc(c.r.match)}</td></tr>`).join('')}</tbody></table></div>`
        :`<p class="text-slate-500 font-bold">圖面清單和目前的設備清單一致，沒有需要更新的項目。</p>`}
        ${unused.length?`<h4 class="mt-5 mb-1 text-sm font-black text-slate-600">圖面清單有、但沒對應到設備主檔的設備（${unused.length}）</h4>
          <p class="text-xs text-slate-400 mb-2">若其中有需要市購品的，請在市購品試算表「設備主檔」的「網站名稱關鍵字」填上名稱。</p>
          <div>${unused.map(u=>`<span class="${TW.tag}">${esc(u.medium)}／${esc(u.name)}</span>`).join('')}</div>`:''}`,
      foot:`<button id="syC" class="${TW.btn}">取消</button><button id="syO" class="${TW.btnPri}"><i class="fa-solid fa-check"></i>${real.length?'套用勾選的變更':'更新來源紀錄'}</button>`});
    if($('chkAll')) $('chkAll').onchange=e=>document.querySelectorAll('#sg-dialog .chg').forEach(c=>c.checked=e.target.checked);
    $('syC').onclick=closeModal;
    $('syO').onclick=()=>{
      const pick=new Set([...document.querySelectorAll('#sg-dialog .chg')].filter(c=>c.checked).map(c=>+c.dataset.i));
      changes.forEach((c,i)=>{ if(c.real&&!pick.has(i)) return;
        p.equip[c.name]={v:c.r.v,qty:c.r.v==='V'?c.r.qty:(p.equip[c.name]||{}).qty??null,src:'圖面',status:c.r.status,match:c.r.match}; });
      if(sp.name&&sp.name!==p.name) p.name=sp.name;
      p.drawingSync={at:new Date().toLocaleString('zh-TW',{hour12:false}),siteName:`${sp.id} ${sp.name||''}`,count:pick.size};
      markDirty(); closeModal(); render(); toast(`已套用 ${pick.size} 項變更，記得按「儲存變更」`);
    };
  }catch(e){ toast('讀取圖面清單失敗：'+e.message,4500); }
}
function archiveDialog(){
  const p=S.proj; const sel=p.schedule.filter(r=>schedSel(r).v==='V'); const notArr=sel.filter(r=>r.arrived!=='V').length;
  let pend=0; S.cfg.cats.forEach(c=>rowsOf(c.key).forEach(r=>{ if(!(r.track&&r.track.date)) pend++; }));
  if(!S.serverV2){ toast('市購品的 Code.gs 需要更新到新版才能歸檔',5000); return; }
  modal({title:'<i class="fa-solid fa-box-archive mr-2"></i>結案歸檔',sub:`${esc(p.id)} ${esc(p.name)}`,
    body:`<p class="text-slate-600 leading-relaxed">歸檔後，這個工案會移到「已結案歸檔」，所有申請表會<b>凍結成目前的內容</b>：之後資料庫的規格再怎麼修改，都不會影響這份歸檔。歸檔期間內容為唯讀，仍可檢視、列印、匯出。</p>
      <div class="mt-4 p-4 rounded-xl text-sm font-bold ${notArr||pend?'bg-amber-50 text-amber-600':'bg-emerald-50 text-emerald-600'}">${notArr||pend?`提醒：採購時程表還有 ${notArr} 項未勾「進貨完成」${pend?`，申請表有 ${pend} 列未填進貨日期`:''}。確定已結案再歸檔。`:'採購項目都已進貨完成。'}</div>
      ${S.dirty?'<p class="text-xs text-slate-400 mt-3">目前未儲存的修改會一併儲存。</p>':''}
      <p class="text-xs text-slate-400 mt-3">之後若需要修改，可以按「取消歸檔」恢復成進行中（會改回使用最新的資料庫規格）。</p>`,
    foot:`<button id="arC" class="${TW.btn}">取消</button><button id="arO" class="${TW.btnPri}"><i class="fa-solid fa-box-archive"></i>確定歸檔</button>`});
  $('arC').onclick=closeModal;
  $('arC').onclick=()=>{ closeModal(); if(S.cardAction){ S.proj=null; S.cardAction=false; } };
  $('arO').onclick=async()=>{ const fromCard=S.cardAction; S.cardAction=false; closeModal(); S.proj=p;
    p.archive=makeSnapshot(); p.status='已歸檔'; p.archivedAt=today(); const ok=await save(true); if(!ok){ delete p.archive; p.status='進行中'; p.archivedAt=''; }
    if(fromCard){ S.proj=null; S.ro=false; } render(); };
}

// ===================== 掛載到專案進度掌控 =====================
let _globalBound=false;
function ensureShell(){
  if(!document.getElementById('sg-modal')){
    const m=document.createElement('div'); m.id='sg-modal'; m.className='hidden fixed inset-0 bg-slate-900/60 z-[70] justify-center items-start backdrop-blur-sm p-4 overflow-y-auto';
    m.innerHTML='<div id="sg-dialog" class="bg-white rounded-3xl shadow-2xl w-full max-w-3xl flex flex-col overflow-hidden mt-10"></div>'; document.body.appendChild(m);
    m.addEventListener('click',e=>{ if(e.target.id==='sg-modal') closeModal(); });
    const t=document.createElement('div'); t.id='sg-toast'; t.className='sg-toast'; document.body.appendChild(t);
    const p=document.createElement('div'); p.id='sg-print'; document.body.appendChild(p);
  }
  if(!_globalBound){ _globalBound=true;
    document.addEventListener('keydown',e=>{ if(!$('sg-root')) return; if((e.ctrlKey||e.metaKey)&&e.key==='s'&&S.view==='project'&&!S.ro){ e.preventDefault(); save(); } if(e.key==='Escape') closeModal(); });
    window.addEventListener('beforeunload',e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=''; } });
  }
}
// view: 'parts'（五金市購品）或 'db'（市購品資料庫）
function mount(el, view){
  ensureShell();
  el.innerHTML='<div id="sg-root"></div>';
  const root=$('sg-root');
  root.addEventListener('click',onClick); root.addEventListener('input',onInput); root.addEventListener('change',onChange);
  S.archMode=(view==='archive'); S.q='';
  if(view==='db') S.view='db';
  else if(!(S.view==='project'&&S.proj)) S.view=(S.view==='setup'&&!S.cfg)?'setup':'list';
  if(!S.cfg){ render(); loadAll(); }
  else { loadSite().catch(()=>{}); render(); }
}
function canLeave(){
  if(S.view==='project'&&S.dirty&&!confirm('五金市購品的工案還有未儲存的修改，確定要離開嗎？')) return false;
  if(S.view==='project'){ S.proj=null; S.dirty=false; S.view='list'; }
  removeDetail(); closeModal();
  return true;
}
window.SG={mount,canLeave};

})();
